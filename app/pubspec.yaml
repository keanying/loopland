name: loopland
description: "圈圈 Loopland · 圈一圈，共同运动，共同圈"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # 状态与路由
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  # 网络与存储
  dio: 5.11.1
  web_socket_channel: 3.0.3
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  shared_preferences: 2.5.6
  uuid: 4.6.0
  # 定位与设备
  geolocator: 14.1.2
  device_info_plus: 13.3.0
  package_info_plus: 10.2.2
  # 地图（高德）
  amap_map: 1.0.15
  x_amap_base: 1.0.3
  # 登录与支付
  fluwx: 6.0.6
  tobias: 6.0.0
  in_app_purchase: 3.3.1
  in_app_purchase_storekit: 0.4.17
  ali_auth: 1.4.0
  # 人机验证（阿里云验证码 2.0 Web 接入）
  webview_flutter: 4.14.1
  # 设备风控：root / 越狱 / 模拟器 / 多开
  safe_device: 1.4.1
  sign_in_with_apple: 8.2.0
  # 界面
  video_player: 2.14.1
  flutter_svg: 2.5.0
  # 自绘图标（lib/widgets/l_icons.dart）解析 SVG 路径
  path_parsing: 1.1.0
  material_ui: 1.11.1
  share_plus: 13.3.1
  # 发布动态 / 头像选图
  image_picker: 1.2.4
  url_launcher: 6.3.3
  intl: 0.20.3
  # AI 跟练（C-09）：前置摄像头 + 端上姿态识别（画面只在本机处理，不上传、不保存）、语音提示
  camera: 0.12.2
  google_mlkit_pose_detection: 0.16.1
  flutter_tts: 4.2.5
  # 语音播报 / 音效 / 角色声音（lib/audio/，素材见 docs/音频素材清单.md）
  audioplayers: 6.8.1
  # 场馆签到（C-07）：App 内扫场馆二维码（Android CameraX + ML Kit 条码，iOS Apple Vision）
  mobile_scanner: 7.5.0
  # 卡券包（E-04）：到店出示的券码二维码（纯 Dart 绘制，无原生代码）
  qr_flutter: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # tool/gen_config.dart：config/app.yaml → 各端配置文件
  path: 1.9.1
  yaml: 3.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/brand/
    - assets/media/
    # 高德控制台导出的暗色自定义样式（style.data / style_extra.data），见 README
    - assets/map/
    # 声音（lib/audio/sound_catalog.dart）
    - assets/audio/voice/run/
    - assets/audio/voice/coach/
    - assets/audio/voice/result/
    - assets/audio/sfx/
    - assets/audio/char/
