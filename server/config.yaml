# 圈圈 Loopland 后端配置（本地开发默认值，可直接提交）
#
# 读取顺序：内置默认值 → 本文件 → 环境变量（同名环境变量优先，见每项注释）。
# 文件位置：$LOOPLAND_CONFIG，否则当前目录的 config.yaml，否则 server/config.yaml。
# 正式环境请复制 config.prod.example.yaml，放在服务器上（不要提交），
# 用 LOOPLAND_CONFIG=/etc/loopland/config.yaml 指定。
# 密钥一律用 *_file 指向密钥文件（或用环境变量），不要直接写在这里。

env: dev                         # LOOPLAND_ENV：dev | prod

http:
  addr: ":8080"                  # LOOPLAND_HTTP_ADDR：监听地址和端口
  public_base_url: http://localhost:8080   # LOOPLAND_PUBLIC_BASE_URL：对外地址，支付回调用
  cors_origins: []               # LOOPLAND_CORS_ORIGINS：允许浏览器跨域调用 API 的网页地址（App 的 Web 版、H5）；dev 下 localhost 任意端口都自动允许

database:
  url: postgres://loopland:loopland@localhost:5433/loopland?sslmode=disable   # LOOPLAND_DATABASE_URL

redis:
  url: redis://localhost:6378/0  # LOOPLAND_REDIS_URL

auth:
  access_ttl: 2h                 # LOOPLAND_ACCESS_TTL
  refresh_ttl: 720h              # LOOPLAND_REFRESH_TTL（30 天）
  bootstrap_admin: "looproot:LoopRoot101011!"   # LOOPLAND_BOOTSTRAP_ADMIN：没有任何管理员时自动创建
  # dev 模式下 JWT 密钥和数据加密密钥有内置默认值，正式环境必须配置：
  # jwt_secret_file: secrets/jwt_secret
  # admin_jwt_secret_file: secrets/admin_jwt_secret
  # data_key_file: secrets/data_key

jobs:
  enabled: true                  # false = LOOPLAND_JOBS_OFF=1，本实例不跑后台任务

media:
  dir: data/media                # LOOPLAND_MEDIA_DIR：没启用对象存储 OSS 时（开发环境）上传图片存这里，相对本文件所在目录

# 用户协议 / 隐私政策页面（后端 /legal/terms、/legal/privacy，App 的协议链接默认指向这里）。
# 上线前必须填写真实的运营主体和联系方式，并请法务审阅协议正文（server/internal/legal/pages/）。
legal:
  company: ""            # LOOPLAND_LEGAL_COMPANY：运营主体（公司全称）；不填时页面显示「待填写」
  email: ""              # LOOPLAND_LEGAL_EMAIL：个人信息保护联系邮箱
  address: ""            # LOOPLAND_LEGAL_ADDRESS：注册地址 / 联系地址
  effective_date: ""     # LOOPLAND_LEGAL_EFFECTIVE_DATE：生效日期（如 2026-12-01）；不填显示协议版本对应月份

features:
  disabled: []                   # LOOPLAND_DISABLE：暂不上线的功能，见 config.prod.example.yaml
  wearable: false                # LOOPLAND_FEATURE_WEARABLE=1：穿戴设备数据（心率、步频、要求穿戴设备的赛事）。预留口子，接入自有设备后再打开，见 docs/设备接入预留.md

# 第三方服务：dev 模式下不填就用假实现（短信验证码固定 000000、mock 支付）。
aliyun:
  access_key_id: ""
  # access_key_secret_file: secrets/aliyun_access_key_secret
  sms:
    sign_name: ""
    template_code: ""
  captcha:
    scene_id: ""

wechat:
  app_id: ""
  pay:
    mch_id: ""
    serial_no: ""
    public_key_id: ""

alipay:
  app_id: ""
  sandbox: true

apple:
  bundle_id: com.loopland.app
