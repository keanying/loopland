name: server

on:
  push:
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: loopland
          POSTGRES_PASSWORD: loopland
          POSTGRES_DB: loopland
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loopland" --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: loopland
    steps:
      - uses: actions/checkout@v4
      - name: up
        run: psql -h localhost -U loopland -d loopland -v ON_ERROR_STOP=1 -f server/migrations/0001_init.up.sql
      - name: down
        run: psql -h localhost -U loopland -d loopland -v ON_ERROR_STOP=1 -f server/migrations/0001_init.down.sql
