<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>开始运动</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Orbitron:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E10}
a{color:#DCF26A;text-decoration:none}a:hover{color:#EAF8A0}
button{font-family:inherit}
div::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0E0E10;color:#F4F4F5;font-family:'Noto Sans SC',system-ui,sans-serif">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;overflow-y:auto;padding:18px 16px 112px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;scrollbar-width:none">

<div style="display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:2px">
<h1 style="margin:0;font-size:26px;font-weight:900;letter-spacing:1px">开始运动</h1>
<div style="font-size:12px;color:#B5B5BE">所有运动都能变成能量，守住你的地盘</div>
</div>
<div style="height:40px;padding:0 14px;border-radius:20px;background:#1F1F25;display:flex;align-items:center;gap:6px;font-size:13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="#FFC857" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg><span style="font-family:Orbitron,sans-serif;font-weight:700">1,280</span></div>
</div>

<div style="background:#DCF26A;color:#121212;border-radius:28px;padding:16px 18px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:flex-end;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;font-weight:700;color:#3D4415">今日能量</span><span><span style="font-family:Orbitron,sans-serif;font-size:28px;font-weight:800">320</span><span style="font-size:13px;font-weight:700"> / 500</span></span></div>
<div style="font-size:12px;color:#2B300E;text-align:right;line-height:1.5">再拿 180 能量<br>领地守卫值 +10</div>
</div>
<div style="height:10px;border-radius:5px;background:rgba(18,18,18,.14);overflow:hidden"><div style="width:64%;height:10px;border-radius:5px;background:#121212"></div></div>
<div style="display:flex;gap:6px;font-size:11px;font-weight:700">
<span style="height:24px;padding:0 10px;border-radius:12px;background:rgba(18,18,18,.1);display:flex;align-items:center">跑步 180</span>
<span style="height:24px;padding:0 10px;border-radius:12px;background:rgba(18,18,18,.1);display:flex;align-items:center">跳绳 90</span>
<span style="height:24px;padding:0 10px;border-radius:12px;background:rgba(18,18,18,.1);display:flex;align-items:center">步数 50</span>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:26px;background:#1B1B20">
<button onClick="{{goOut}}" aria-pressed="{{pOut}}" style="height:40px;border:0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;{{sOut}}">户外</button>
<button onClick="{{goVenue}}" aria-pressed="{{pVenue}}" style="height:40px;border:0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;{{sVenue}}">场馆球类</button>
<button onClick="{{goHome}}" aria-pressed="{{pHome}}" style="height:40px;border:0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;{{sHome}}">居家跟练</button>
</div>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{list}}" as="s" hint-placeholder-count="6">
<button onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height:96px;border-radius:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;color:#F4F4F5;{{s.box}}">
<span style="width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;{{s.icBox}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.ic}}"></path></svg></span>
<span style="font-size:13px;font-weight:700">{{s.name}}</span>
<sc-if value="{{s.hasTag}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:8px;top:8px;height:18px;padding:0 6px;border-radius:9px;background:#FF9F5A;color:#121212;font-size:10px;font-weight:700;display:flex;align-items:center">{{s.tag}}</span></sc-if>
</button>
</sc-for>
</div>

<div style="background:#1B1B20;border:1px solid #2A2A31;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:10px">
<span style="font-size:18px;font-weight:900">{{cur.name}}</span>
<span style="height:26px;padding:0 10px;border-radius:13px;background:#B4A3F5;color:#121212;font-size:12px;font-weight:700;display:flex;align-items:center">{{cur.rule}}</span>
</div>
<div style="font-size:13px;color:#C9C9D1;line-height:1.6">{{cur.desc}}</div>
<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#B5B5BE"><svg width="14" height="14" viewBox="0 0 24 24" fill="#FFC857" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>每 10 分钟约 <span style="font-family:Orbitron,sans-serif;font-weight:700;color:#F4F4F5">{{cur.energy}}</span> 能量</div>
<sc-if value="{{isOut}}" hint-placeholder-val="{{ true }}">
<a href="Run.dc.html" style="height:52px;border-radius:26px;background:#DCF26A;color:#121212;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>开始{{cur.name}}</a>
</sc-if>
<sc-if value="{{isVenue}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:10px">
<a href="Local.dc.html" style="flex-grow:1;height:52px;border-radius:26px;background:#DCF26A;color:#121212;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center">找场馆 · 订场</a>
<button onClick="{{checkin}}" style="height:52px;padding:0 18px;border-radius:26px;cursor:pointer;font-size:14px;font-weight:700;{{ckStyle}}">{{ckLabel}}</button>
</div>
</sc-if>
<sc-if value="{{isHome}}" hint-placeholder-val="{{ false }}">
<a href="Coach.dc.html" style="height:52px;border-radius:26px;background:#DCF26A;color:#121212;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>开始 AI 跟练</a>
</sc-if>
</div>

</div>

<nav aria-label="主导航" style="position:absolute;left:12px;bottom:12px;width:366px;height:92px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))"><svg width="366" height="92" viewBox="0 0 366 92" aria-hidden="true" style="position:absolute;left:0;top:0;display:block"><path d="M37 18 H 112 C 138 18, 150 2, 183 2 C 216 2, 228 18, 254 18 H 329 A 37 37 0 0 1 329 92 H 37 A 37 37 0 0 1 37 18 Z" fill="#1B1B20" stroke="#2C2C34" stroke-width="1"></path></svg><a href="Main.dc.html" aria-label="领地" style="position:absolute;left:22px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7C7C86;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:0"></span></a><a href="Codex.dc.html" aria-label="图鉴" style="position:absolute;left:88px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7C7C86;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h11v15H8zM5 6v15h11"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:0"></span></a><a href="Club.dc.html" aria-label="社区" style="position:absolute;left:230px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7C7C86;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:0"></span></a><a href="Profile.dc.html" aria-label="我的" style="position:absolute;left:296px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7C7C86;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.2-6.5 8-6.5s7 2.5 8 6.5"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:0"></span></a><a href="Sports.dc.html" aria-label="开始运动" aria-current="page" style="position:absolute;left:149px;top:6px;width:68px;height:68px;border-radius:34px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#B4A3F5,#DCF26A);border:0;color:#121212;box-shadow:0 0 26px rgba(180,163,245,.55);color:#121212;text-decoration:none"><svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true" style="position:absolute;left:-10px;top:-10px;pointer-events:none"><circle cx="44" cy="44" r="41" fill="none" stroke="#DCF26A" stroke-width="2" stroke-dasharray="1.5 9" stroke-linecap="round" opacity=".75"><animateTransform attributeName="transform" type="rotate" from="0 44 44" to="360 44 44" dur="14s" repeatCount="indefinite"></animateTransform></circle></svg><svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true" style="position:relative;overflow:visible"><g stroke="#141414" stroke-linecap="round" stroke-linejoin="round"><path d="M5 30h7M3 37h8M6 44h6" stroke="#DCF26A" stroke-width="2.4"></path><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="0.32s" repeatCount="indefinite"></animateTransform><g><animateTransform attributeName="transform" type="rotate" values="28 27 40;-28 27 40;28 27 40" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M27 40 L24 50 L28 52" fill="none" stroke-width="3.4"></path><path d="M27 40 L24 50 L28 52" fill="none" stroke="#E0A33A" stroke-width="1.4"></path></g><g><animateTransform attributeName="transform" type="rotate" values="-28 39 39;28 39 39;-28 39 39" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M39 39 L42 49 L46 49" fill="none" stroke-width="3.4"></path><path d="M39 39 L42 49 L46 49" fill="none" stroke="#E0A33A" stroke-width="1.4"></path></g><path d="M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39" fill="none" stroke-width="6"></path><path d="M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39" fill="none" stroke="#FFC857" stroke-width="3"><animate attributeName="d" values="M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39;M22 37 C 15 37, 12 41, 7 39 C 4 38, 4 35, 7 35;M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39" dur="0.64s" repeatCount="indefinite"></animate></path><ellipse cx="32" cy="36" rx="12" ry="7.5" transform="rotate(-14 32 36)" fill="#FFC857" stroke-width="2.2"></ellipse><circle cx="28" cy="35" r="1.8" fill="#FF6A3D" stroke="none"></circle><circle cx="34" cy="32.5" r="1.5" fill="#FF6A3D" stroke="none"></circle><g><animateTransform attributeName="transform" type="rotate" values="-30 30 41;30 30 41;-30 30 41" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M30 41 L27 51 L31 53" fill="none" stroke-width="3.6"></path><path d="M30 41 L27 51 L31 53" fill="none" stroke="#FFC857" stroke-width="1.6"></path></g><g><animateTransform attributeName="transform" type="rotate" values="30 41 38;-30 41 38;30 41 38" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M41 38 L45 47 L49 46" fill="none" stroke-width="3.6"></path><path d="M41 38 L45 47 L49 46" fill="none" stroke="#FFC857" stroke-width="1.6"></path></g><circle cx="45" cy="25" r="9" fill="#FFC857" stroke-width="2.2"></circle><circle cx="48" cy="22" r="4.2" fill="#FFFFFF" stroke-width="1.6"></circle><circle cx="49.3" cy="22" r="2" fill="#141414" stroke="none"></circle><path d="M46 30 Q 50 32.5 53.5 28.5" fill="none" stroke-width="1.8"></path><path d="M38 18 l3 -4 1 3 3 -3" fill="none" stroke="#DCF26A" stroke-width="2"></path></g></g></svg></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'out', sel: { out: 0, venue: 1, home: 0 }, checked: false };
  }
  renderVals() {
    const st = this.state;
    const c = (x, y, r) => 'M' + (x - r) + ' ' + y + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0';
    const I = {
      run: c(14, 5, 1.8) + 'M10 21l2.5-5.5 3 2.5v4M7 12.5l3-3.5 4.5 1.5 2.5 3',
      bike: c(6, 16, 3.5) + c(18, 16, 3.5) + 'M6 16l4-7h5l3 7M9 9h3',
      hike: 'M3 20l6-10 4 6 3-4 5 8z',
      trail: 'M3 20l5-9 3 4 4-8 6 13',
      walk: c(12, 4.5, 1.8) + 'M12 8v6l-3 7M12 14l3 7M9 11l3-2 3 2',
      orient: c(12, 12, 8) + 'M15 9l-2 5-4 1 2-5z',
      badminton: 'M5 19l6-6M11 13l6-8 2 2-8 6z',
      pickle: c(9, 9, 5) + 'M12.5 12.5l6 6',
      tennis: c(12, 12, 8) + 'M5 7c4 2 4 8 0 10M19 7c-4 2-4 8 0 10',
      basket: c(12, 12, 8) + 'M4 12h16M12 4v16',
      football: c(12, 12, 8) + 'M12 8l3 2-1 4h-4l-1-4z',
      swim: 'M3 17c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 6 0M3 13c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 6 0M14 9l-3-3 4-2',
      disc: 'M3 12c0-2.5 4-4.5 9-4.5s9 2 9 4.5-4 4.5-9 4.5-9-2-9-4.5zM7 12h10',
      climb: c(14, 4, 1.6) + 'M6 21l4-8 3 2 2-6 3 1',
      gym: 'M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12',
      rope: 'M6 4v5M18 4v5M6 9c0 8 12 8 12 0',
      flame: 'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5',
      yoga: c(12, 5, 1.8) + 'M12 8v6M5 11l7 2 7-2M8 21l4-7 4 7',
      pilates: 'M3 18h18M6 18c2-6 10-8 12-8' + c(18, 8, 1.6),
      stretch: c(6, 6, 1.8) + 'M6 9l4 5 8-2M10 14l-2 7'
    };
    const D = {
      out: [
        { name: '跑步', ic: I.run, rule: '自由圈地', desc: '不用规划路线，随便跑。轨迹一交叉就自动圈下一块地，一次跑步能连圈好几块。', energy: 30, tag: '核心' },
        { name: '骑行', ic: I.bike, rule: '骑行地图', desc: '骑行有独立的领地地图，和跑步分开计算，骑车的人不会抢跑者的地。', energy: 20, tag: '' },
        { name: '徒步', ic: I.hike, rule: '山野图层', desc: '郊野路线按登顶和打卡点计入，周末徒步也能拿赛季积分和山野徽章。', energy: 25, tag: '热门' },
        { name: '越野跑', ic: I.trail, rule: '爬升计分', desc: '爬升越多能量越高，山野图层里按爬升高度占领山头。', energy: 40, tag: '热门' },
        { name: '健走', ic: I.walk, rule: '步行圈地', desc: '速度慢也能圈地，通勤和饭后散步都算，适合不爱跑步的人。', energy: 15, tag: '' },
        { name: '城市定向', ic: I.orient, rule: '打卡任务', desc: '按任务卡依次打卡城市地标，完成整条路线得限定徽章和商户券。', energy: 30, tag: '新' }
      ],
      venue: [
        { name: '羽毛球', ic: I.badminton, rule: '球馆据点', desc: '在合作球馆扫码签到即计入。本月签到最多的跑团成为该球馆的「馆主」，地图上显示你们的颜色。', energy: 35, tag: '' },
        { name: '匹克球', ic: I.pickle, rule: '球馆据点', desc: '上手快、社交强。签到占领匹克球馆，新手局还有教练带打。', energy: 35, tag: '爆火' },
        { name: '网球', ic: I.tennis, rule: '球馆据点', desc: '学练馆、俱乐部签到都算，打完自动导入时长和心率。', energy: 35, tag: '' },
        { name: '篮球', ic: I.basket, rule: '球场据点', desc: '室外公共球场也能签到，3v3 斗牛赢一局得额外能量。', energy: 40, tag: '' },
        { name: '足球', ic: I.football, rule: '城市联赛', desc: '踢球签到给你所在的城区加分，参与城区争霸联赛。', energy: 40, tag: '联赛' },
        { name: '游泳', ic: I.swim, rule: '泳馆据点', desc: '手表记录游泳距离，签到泳馆后按距离折算能量。', energy: 35, tag: '' },
        { name: '飞盘', ic: I.disc, rule: '组局签到', desc: '在组局里一起签到，全队同时加能量，适合新手破冰。', energy: 35, tag: '' },
        { name: '攀岩', ic: I.climb, rule: '岩馆据点', desc: '完成线路后扫码打卡，难度越高能量越多。', energy: 40, tag: '' },
        { name: '健身房', ic: I.gym, rule: '门店据点', desc: '合作健身房签到即可，力量训练按时长折算能量。', energy: 30, tag: '' }
      ],
      home: [
        { name: '跳绳', ic: I.rope, rule: 'AI 计数', desc: '手机摄像头自动数个数，每 100 个折算 10 能量，下雨天也能守地。', energy: 25, tag: '' },
        { name: 'HIIT', ic: I.flame, rule: 'AI 跟练', desc: '跟着 AI 教练做间歇训练，动作标准度越高能量越多。', energy: 35, tag: '' },
        { name: '瑜伽', ic: I.yoga, rule: 'AI 跟练', desc: '舒缓课程，适合跑后放松，连续打卡有额外奖励。', energy: 15, tag: '' },
        { name: '普拉提', ic: I.pilates, rule: 'AI 跟练', desc: '核心训练课程，AI 实时纠正动作。', energy: 20, tag: '热门' },
        { name: '力量', ic: I.gym, rule: 'AI 计数', desc: '深蹲、俯卧撑自动计数，按组完成度计算能量。', energy: 30, tag: '' },
        { name: '拉伸', ic: I.stretch, rule: '恢复', desc: '跑后拉伸 10 分钟，第二天的跑步能量 +10%。', energy: 10, tag: '' }
      ]
    };
    const on = 'background:#F4F4F5;color:#121212';
    const off = 'background:transparent;color:#C9C9D1';
    const cat = st.cat;
    const idx = st.sel[cat];
    const list = D[cat].map((s, i) => ({
      ...s,
      hasTag: !!s.tag,
      pressed: i === idx ? 'true' : 'false',
      box: i === idx ? 'border:1.5px solid #DCF26A;background:#1E2213' : 'border:1.5px solid #232329;background:#1B1B20',
      icBox: i === idx ? 'background:#DCF26A;color:#121212' : 'background:#2A2A31;color:#F4F4F5',
      pick: () => this.setState({ sel: { ...this.state.sel, [cat]: i }, checked: false })
    }));
    return {
      list,
      cur: D[cat][idx],
      isOut: cat === 'out', isVenue: cat === 'venue', isHome: cat === 'home',
      sOut: cat === 'out' ? on : off, sVenue: cat === 'venue' ? on : off, sHome: cat === 'home' ? on : off,
      pOut: cat === 'out' ? 'true' : 'false', pVenue: cat === 'venue' ? 'true' : 'false', pHome: cat === 'home' ? 'true' : 'false',
      goOut: () => this.setState({ cat: 'out', checked: false }),
      goVenue: () => this.setState({ cat: 'venue', checked: false }),
      goHome: () => this.setState({ cat: 'home', checked: false }),
      checkin: () => this.setState({ checked: true }),
      ckLabel: st.checked ? '已签到 +35' : '扫码签到',
      ckStyle: st.checked ? 'border:1.5px solid #DCF26A;background:transparent;color:#DCF26A' : 'border:1.5px solid #3A3A42;background:transparent;color:#F4F4F5'
    };
  }
}
</script>
</body>
</html>
