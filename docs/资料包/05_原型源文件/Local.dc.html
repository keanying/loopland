<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>本地生活</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Orbitron:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E10}
a{color:#DCF26A;text-decoration:none}a:hover{color:#EAF8A0}
button{font-family:inherit}
button:disabled{cursor:not-allowed}
div::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0E0E10;color:#F4F4F5;font-family:'Noto Sans SC',system-ui,sans-serif">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;overflow-y:auto;padding:18px 16px 112px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;scrollbar-width:none">

<div style="display:flex;align-items:center;gap:12px">
<a href="Profile.dc.html" aria-label="返回我的" style="width:44px;height:44px;border-radius:22px;background:#1F1F25;color:#F4F4F5;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display:flex;flex-direction:column;gap:2px;flex-grow:1">
<h1 style="margin:0;font-size:24px;font-weight:900;letter-spacing:1px">本地生活</h1>
<div style="font-size:12px;color:#B5B5BE">订场 · 品牌联名 · 用能量换福利</div>
</div>
<div style="height:40px;padding:0 12px;border-radius:20px;background:#1F1F25;display:flex;align-items:center;gap:6px;font-size:13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="#FFC857" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg><span style="font-family:Orbitron,sans-serif;font-weight:700">{{energyText}}</span></div>
</div>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:26px;background:#1B1B20">
<button onClick="{{tBook}}" aria-pressed="{{pBook}}" style="height:40px;border:0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;{{sBook}}">订场</button>
<button onClick="{{tCollab}}" aria-pressed="{{pCollab}}" style="height:40px;border:0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;{{sCollab}}">联名活动</button>
<button onClick="{{tShop}}" aria-pressed="{{pShop}}" style="height:40px;border:0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;{{sShop}}">能量商城</button>
</div>

<sc-if value="{{isBook}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0">
<sc-for list="{{sports}}" as="s" hint-placeholder-count="5">
<button onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height:38px;padding:0 16px;border-radius:19px;border:0;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0;{{s.st}}">{{s.name}}</button>
</sc-for>
</div>
<a href="Social.dc.html" style="background:#26223A;border:1px solid #B4A3F5;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px;color:#F4F4F5">
<span style="height:24px;padding:0 8px;border-radius:12px;background:#B4A3F5;color:#121212;font-family:Orbitron,sans-serif;font-size:11px;font-weight:800;display:flex;align-items:center;flex-shrink:0">AI</span>
<span style="font-size:12px;line-height:1.5;flex-grow:1">{{aiTip}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{venues}}" as="v" hint-placeholder-count="3">
<div style="background:#1B1B20;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;{{v.border}}">
<button onClick="{{v.open}}" aria-expanded="{{v.expanded}}" style="border:0;background:transparent;color:#F4F4F5;padding:0;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left">
<span style="width:48px;height:48px;border-radius:16px;background:{{v.color}};color:#121212;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;flex-shrink:0">{{v.ini}}</span>
<span style="display:flex;flex-direction:column;gap:3px;flex-grow:1;min-width:0"><span style="font-size:15px;font-weight:700">{{v.name}}</span><span style="font-size:11px;color:#B5B5BE">{{v.meta}}</span><span style="font-size:11px;color:{{v.color}}">馆主 · {{v.owner}}</span></span>
<span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span style="font-family:Orbitron,sans-serif;font-size:16px;font-weight:700">¥{{v.price}}</span><span style="font-size:10px;color:#B5B5BE">/小时</span></span>
</button>
<sc-if value="{{v.isOpen}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:12px;color:#B5B5BE">今天 11 月 19 日 · 选择时段</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">
<sc-for list="{{slots}}" as="t" hint-placeholder-count="8">
<button onClick="{{t.pick}}" disabled="{{t.full}}" aria-pressed="{{t.pressed}}" style="height:40px;border-radius:14px;font-family:Orbitron,sans-serif;font-size:12px;font-weight:700;cursor:pointer;{{t.st}}">{{t.time}}</button>
</sc-for>
</div>
<button onClick="{{confirm}}" style="height:48px;border-radius:24px;border:0;font-size:15px;font-weight:700;cursor:pointer;{{confirmStyle}}">{{confirmLabel}}</button>
</div>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isCollab}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{collabs}}" as="c" hint-placeholder-count="4">
<div style="background:#1B1B20;border:1px solid #232329;border-radius:24px;overflow:hidden;display:flex;flex-direction:column">
<div style="background:{{c.color}};color:#121212;padding:14px 16px;display:flex;flex-direction:column;gap:4px">
<span style="font-size:11px;font-weight:700">{{c.type}}</span>
<span style="font-size:18px;font-weight:900">{{c.title}}</span>
</div>
<div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
<div style="font-size:13px;color:#C9C9D1;line-height:1.6">{{c.desc}}</div>
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="font-size:12px;color:#B5B5BE">{{c.meta}}</span>
<button onClick="{{c.join}}" style="height:40px;padding:0 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:700;{{c.btn}}">{{c.label}}</button>
</div>
</div>
</div>
</sc-for>
<div style="font-size:11px;color:#9A9AA4;text-align:center">品牌可在商家后台发起联名 · 按报名或核销结算</div>
</div>
</sc-if>

<sc-if value="{{isShop}}" hint-placeholder-val="{{ false }}">
<div style="background:#DCF26A;color:#121212;border-radius:24px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;font-weight:700">可用能量</span><span style="font-family:Orbitron,sans-serif;font-size:26px;font-weight:800">{{energyText}}</span></div>
<span style="font-size:12px;color:#2B300E;text-align:right;line-height:1.5">跑步、球类、跟练<br>都能赚能量</span>
</div>
<sc-if value="{{hasMsg}}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;color:#DCF26A;text-align:center">{{msg}}</div></sc-if>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<div style="background:#1B1B20;border:1px solid #232329;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px">
<span style="height:64px;border-radius:16px;background:{{it.color}};color:#121212;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900">{{it.big}}</span>
<span style="font-size:13px;font-weight:700">{{it.name}}</span>
<span style="font-size:11px;color:#B5B5BE">{{it.sub}}</span>
<button onClick="{{it.redeem}}" disabled="{{it.cant}}" style="height:38px;border-radius:19px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;{{it.btn}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>{{it.label}}</button>
</div>
</sc-for>
</div>
</sc-if>

</div>

<nav aria-label="主导航" style="position:absolute;left:12px;bottom:12px;width:366px;height:92px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))"><svg width="366" height="92" viewBox="0 0 366 92" aria-hidden="true" style="position:absolute;left:0;top:0;display:block"><path d="M37 18 H 112 C 138 18, 150 2, 183 2 C 216 2, 228 18, 254 18 H 329 A 37 37 0 0 1 329 92 H 37 A 37 37 0 0 1 37 18 Z" fill="#1B1B20" stroke="#2C2C34" stroke-width="1"></path></svg><a href="Main.dc.html" aria-label="领地" style="position:absolute;left:22px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7C7C86;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:0"></span></a><a href="Codex.dc.html" aria-label="图鉴" style="position:absolute;left:88px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7C7C86;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h11v15H8zM5 6v15h11"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:0"></span></a><a href="Club.dc.html" aria-label="社区" style="position:absolute;left:230px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7C7C86;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:0"></span></a><a href="Profile.dc.html" aria-label="我的" aria-current="page" style="position:absolute;left:296px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#FFFFFF;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.2-6.5 8-6.5s7 2.5 8 6.5"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:1"></span></a><a href="Sports.dc.html" aria-label="开始运动" style="position:absolute;left:149px;top:6px;width:68px;height:68px;border-radius:34px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:linear-gradient(#1B1B20,#1B1B20) padding-box,linear-gradient(140deg,#B4A3F5,#DCF26A) border-box;border:3px solid transparent;box-shadow:0 0 22px rgba(180,163,245,.45);color:#FFFFFF;text-decoration:none"><svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true" style="position:absolute;left:-10px;top:-10px;pointer-events:none"><circle cx="44" cy="44" r="41" fill="none" stroke="#B4A3F5" stroke-width="2" stroke-dasharray="1.5 9" stroke-linecap="round" opacity=".75"><animateTransform attributeName="transform" type="rotate" from="0 44 44" to="360 44 44" dur="14s" repeatCount="indefinite"></animateTransform></circle></svg><svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true" style="position:relative;overflow:visible"><g stroke="#141414" stroke-linecap="round" stroke-linejoin="round"><path d="M5 30h7M3 37h8M6 44h6" stroke="#DCF26A" stroke-width="2.4"></path><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="0.32s" repeatCount="indefinite"></animateTransform><g><animateTransform attributeName="transform" type="rotate" values="28 27 40;-28 27 40;28 27 40" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M27 40 L24 50 L28 52" fill="none" stroke-width="3.4"></path><path d="M27 40 L24 50 L28 52" fill="none" stroke="#E0A33A" stroke-width="1.4"></path></g><g><animateTransform attributeName="transform" type="rotate" values="-28 39 39;28 39 39;-28 39 39" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M39 39 L42 49 L46 49" fill="none" stroke-width="3.4"></path><path d="M39 39 L42 49 L46 49" fill="none" stroke="#E0A33A" stroke-width="1.4"></path></g><path d="M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39" fill="none" stroke-width="6"></path><path d="M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39" fill="none" stroke="#FFC857" stroke-width="3"><animate attributeName="d" values="M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39;M22 37 C 15 37, 12 41, 7 39 C 4 38, 4 35, 7 35;M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39" dur="0.64s" repeatCount="indefinite"></animate></path><ellipse cx="32" cy="36" rx="12" ry="7.5" transform="rotate(-14 32 36)" fill="#FFC857" stroke-width="2.2"></ellipse><circle cx="28" cy="35" r="1.8" fill="#FF6A3D" stroke="none"></circle><circle cx="34" cy="32.5" r="1.5" fill="#FF6A3D" stroke="none"></circle><g><animateTransform attributeName="transform" type="rotate" values="-30 30 41;30 30 41;-30 30 41" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M30 41 L27 51 L31 53" fill="none" stroke-width="3.6"></path><path d="M30 41 L27 51 L31 53" fill="none" stroke="#FFC857" stroke-width="1.6"></path></g><g><animateTransform attributeName="transform" type="rotate" values="30 41 38;-30 41 38;30 41 38" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M41 38 L45 47 L49 46" fill="none" stroke-width="3.6"></path><path d="M41 38 L45 47 L49 46" fill="none" stroke="#FFC857" stroke-width="1.6"></path></g><circle cx="45" cy="25" r="9" fill="#FFC857" stroke-width="2.2"></circle><circle cx="48" cy="22" r="4.2" fill="#FFFFFF" stroke-width="1.6"></circle><circle cx="49.3" cy="22" r="2" fill="#141414" stroke="none"></circle><path d="M46 30 Q 50 32.5 53.5 28.5" fill="none" stroke-width="1.8"></path><path d="M38 18 l3 -4 1 3 3 -3" fill="none" stroke="#DCF26A" stroke-width="2"></path></g></g></svg></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'book', sport: 'pickle', open: 'v1', slot: null, booked: false, joined: {}, energy: 1280, owned: {}, msg: '' };
  }
  renderVals() {
    const st = this.state;
    const on = 'background:#F4F4F5;color:#121212';
    const off = 'background:transparent;color:#C9C9D1';
    const chipOn = 'background:#DCF26A;color:#121212';
    const chipOff = 'background:#1F1F25;color:#C9C9D1';
    const S = [{ id: 'badminton', name: '羽毛球' }, { id: 'pickle', name: '匹克球' }, { id: 'tennis', name: '网球' }, { id: 'basket', name: '篮球' }, { id: 'swim', name: '游泳' }];
    const sports = S.map((s) => ({ ...s, pressed: s.id === st.sport ? 'true' : 'false', st: s.id === st.sport ? chipOn : chipOff, pick: () => this.setState({ sport: s.id, slot: null, booked: false, open: 'v1' }) }));
    const sname = S.find((s) => s.id === st.sport).name;
    const V = [
      { id: 'v1', ini: '南', name: '城南全民健身中心 · ' + sname, meta: '距你 0.8 km · 室内 · 可租拍', owner: '夜跑兔（你的跑团）', color: '#B4A3F5', price: 60 },
      { id: 'v2', ini: '港', name: '东港运动公园 · ' + sname, meta: '距你 1.6 km · 室外 · 夜场灯光', owner: '城西跑团', color: '#F28DC0', price: 40 },
      { id: 'v3', ini: '学', name: '学府路体育馆 · ' + sname, meta: '距你 2.9 km · 室内 · 学生价', owner: '暂无馆主 · 先签到先得', color: '#6FD3E8', price: 50 }
    ];
    const venues = V.map((v) => ({
      ...v,
      isOpen: st.open === v.id,
      expanded: st.open === v.id ? 'true' : 'false',
      border: st.open === v.id ? 'border:1.5px solid ' + v.color : 'border:1px solid #232329',
      open: () => this.setState({ open: this.state.open === v.id ? null : v.id, slot: null, booked: false })
    }));
    const T = ['18:00', '19:00', '20:00', '21:00', '22:00', '07:00', '08:00', '12:00'];
    const fullSet = { '19:00': 1, '20:00': 1 };
    const slots = T.map((t) => {
      const full = !!fullSet[t];
      const sel = st.slot === t;
      return {
        time: t, full, pressed: sel ? 'true' : 'false',
        st: full ? 'border:0;background:#17171B;color:#55555E;text-decoration:line-through' : (sel ? 'border:0;background:#DCF26A;color:#121212' : 'border:1px solid #3A3A42;background:transparent;color:#F4F4F5'),
        pick: () => { if (!full) this.setState({ slot: t, booked: false }); }
      };
    });
    const curV = V.find((v) => v.id === st.open) || V[0];
    let confirmLabel = '先选一个时段', confirmStyle = 'background:#2A2A31;color:#B5B5BE';
    if (st.booked) { confirmLabel = '已预订 ' + st.slot + ' · 到场签到即占领据点'; confirmStyle = 'background:#2A2A31;color:#DCF26A'; }
    else if (st.slot) { confirmLabel = '确认预订 ' + st.slot + ' · ¥' + curV.price; confirmStyle = 'background:#DCF26A;color:#121212'; }
    const C = [
      { id: 'c1', type: '品牌联名 · 线上跑', title: '[茶饮品牌] × 圈地 · 冬日暖跑', desc: '12 月内完成 5 km 闭环，得联名实体奖牌和一杯热饮券。奖牌背面刻你占领的地块名。', meta: '已报名 12,408 人', color: '#DCF26A', price: '报名 ¥39' },
      { id: 'c2', type: '品牌体验日 · 线下', title: '[运动品牌] 匹克球体验日', desc: '周六在品牌门店旁的球场免费试打，教练带新手，当天签到能量翻倍。', meta: '11.22 周六 · 限 60 人', color: '#F28DC0', price: '免费报名' },
      { id: 'c3', type: '金融权益', title: '[合作银行] 运动达标礼', desc: '本月累计运动 50 km（任何运动折算），绑定的信用卡可领消费立减券。', meta: '本月进度 38 / 50 km', color: '#6FD3E8', price: '去绑定' },
      { id: 'c4', type: '健康权益', title: '[保险合作方] 健康守护计划', desc: '每月运动达标 20 天，可领健康金，抵扣体检或门诊费用。', meta: '本月已达标 13 天', color: '#B4A3F5', price: '加入计划' }
    ];
    const collabs = C.map((c) => {
      const j = !!st.joined[c.id];
      return { ...c, label: j ? '已参加' : c.price, btn: j ? 'border:1.5px solid #DCF26A;background:transparent;color:#DCF26A' : 'border:0;background:#DCF26A;color:#121212', join: () => this.setState({ joined: { ...this.state.joined, [c.id]: true } }) };
    });
    const I = [
      { id: 'i1', name: '美式咖啡 8 折券', sub: '[合作咖啡品牌] 全城门店', cost: 300, big: '8 折', color: '#DCF26A' },
      { id: 'i2', name: '运动饮料兑换券', sub: '[合作便利店]', cost: 200, big: '饮料', color: '#6FD3E8' },
      { id: 'i3', name: '订场 9 折券', sub: '合作球馆通用', cost: 400, big: '9 折', color: '#B4A3F5' },
      { id: 'i4', name: '领地皮肤 · 极光', sub: '地图上你的地块变成极光色', cost: 500, big: '皮肤', color: '#F28DC0' },
      { id: 'i5', name: '小芽外观 · 雪帽', sub: '跑步伙伴限定装扮', cost: 350, big: '外观', color: '#FFC857' },
      { id: 'i6', name: '奖牌抵扣 ¥10', sub: '领取实体奖牌时使用', cost: 600, big: '¥10', color: '#FF9F5A' }
    ];
    const items = I.map((it) => {
      const own = !!st.owned[it.id];
      const cant = !own && st.energy < it.cost;
      return {
        ...it, cant: cant || own,
        label: own ? '已兑换' : (cant ? '能量不足 ' + it.cost : it.cost + ' 兑换'),
        btn: own ? 'border:1.5px solid #DCF26A;background:transparent;color:#DCF26A' : (cant ? 'border:0;background:#2A2A31;color:#8A8A94' : 'border:0;background:#DCF26A;color:#121212'),
        redeem: () => { if (!own && this.state.energy >= it.cost) this.setState({ energy: this.state.energy - it.cost, owned: { ...this.state.owned, [it.id]: true }, msg: '兑换成功：' + it.name + '，已放进卡包' }); }
      };
    });
    const tips = { badminton: '周四 20:00 城南羽毛球双打局还差 1 人，和你水平接近', pickle: '今晚 21:00 匹克球新手局还差 2 人，离你 0.8 km，去组局看看', tennis: '周六上午有 2 位网球搭子在找对练，水平 2.5 级', basket: '东港运动公园今晚有 3v3 斗牛局，赢了能量翻倍', swim: '城南泳馆 12:00 人最少，适合练距离' };
    return {
      sports, venues, slots, collabs, items,
      aiTip: 'AI 推荐：' + tips[st.sport],
      energyText: st.energy.toLocaleString('en-US'),
      isBook: st.tab === 'book', isCollab: st.tab === 'collab', isShop: st.tab === 'shop',
      sBook: st.tab === 'book' ? on : off, sCollab: st.tab === 'collab' ? on : off, sShop: st.tab === 'shop' ? on : off,
      pBook: st.tab === 'book' ? 'true' : 'false', pCollab: st.tab === 'collab' ? 'true' : 'false', pShop: st.tab === 'shop' ? 'true' : 'false',
      tBook: () => this.setState({ tab: 'book' }), tCollab: () => this.setState({ tab: 'collab' }), tShop: () => this.setState({ tab: 'shop' }),
      confirm: () => { if (this.state.slot) this.setState({ booked: true }); },
      confirmLabel, confirmStyle,
      hasMsg: !!st.msg, msg: st.msg
    };
  }
}
</script>
