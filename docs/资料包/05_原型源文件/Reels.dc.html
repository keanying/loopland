<x-dc>

</div>
</div>

<div style="position:absolute;left:16px;right:16px;top:18px;display:flex;align-items:center;gap:6px">
<button onClick="{{tFollow}}" aria-pressed="{{pFollow}}" style="height:40px;padding:0 10px;border:0;background:transparent;cursor:pointer;font-size:16px;font-weight:900;{{sFollow}}">关注</button>
<button onClick="{{tRec}}" aria-pressed="{{pRec}}" style="height:40px;padding:0 10px;border:0;background:transparent;cursor:pointer;font-size:16px;font-weight:900;{{sRec}}">推荐</button>
<span style="flex-grow:1"></span>
<a href="Compose.dc.html" aria-label="发布动态" style="width:44px;height:44px;border-radius:22px;background:rgba(244,244,245,.16);color:#F4F4F5;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></a>

<div style="position:absolute;left:16px;right:16px;top:72px;display:flex;align-items:center;gap:10px;background:rgba(14,14,16,.72);border-radius:28px;padding:8px 8px 8px 8px">
<a href="UserProfile.dc.html" style="display:flex;align-items:center;gap:10px;flex-grow:1;min-width:0;color:#F4F4F5">

<button onClick="{{follow}}" aria-pressed="{{fPressed}}" style="height:38px;padding:0 16px;border-radius:19px;border:0;cursor:pointer;font-size:13px;font-weight:700;flex-shrink:0;{{fStyle}}">{{fLabel}}</button>

</div>

<div role="status" style="position:absolute;left:50%;top:150px;transform:translateX(-50%);height:40px;padding:0 16px;border-radius:20px;background:#F4F4F5;color:#121212;font-size:13px;font-weight:700;display:flex;align-items:center;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)">{{toast}}</div>
</sc-if>

<sc-if value="{{shareOpen}}" hint-placeholder-val="{{ false }}">

      { name: '抖音', bg: '#F4F4F5', ic: 'M10 4v11a3 3 0 1 1-3-3M10 4c1 3 3 4 6 4' },
      { name: '发给跑团', bg: '#B4A3F5', ic: 'M9 11a3 3 0 1 0 0-6 3 3 0 1 0 0 6zM3 20c1-3.5 3.4-5 6-5s5 1.5 6 5M16 5a3 3 0 0 1 0 6M18 15c1.6.6 2.6 2 3 5' },
      { name: '转发到动态', bg: '#B4A3F5', ic: 'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3' },
      { name: '保存视频', bg: '#FFC857', ic: 'M12 4v12M7 11l5 5 5-5M5 20h14' },
      { name: '复制链接', bg: '#2A2A31', ic: 'M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1' }
    ];
    const targets = T.map((t) => ({ ...t, go: () => { this.setState({ shareOpen: false, shared: { ...this.state.shared, [cur.id]: true } }); this.flash(t.name === '复制链接' ? '链接已复制' : (t.name === '保存视频' ? '回放视频已保存到相册' : '已分享到' + t.name)); } }));
    const fmt = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(n));
    return {
      cur,
      playState: st.playing ? 'running' : 'paused',
      playIcon: st.playing ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M8 5v14l11-7z',
      playAria: st.playing ? '暂停回放' : '播放回放',
      playBtnOp: st.playing ? '0.35' : '1',
      togglePlay: () => this.setState({ playing: !this.state.playing }),
      onDown: (e) => { this.y0 = e.clientY; },
      onCancel: () => { this.y0 = null; },
      onUp: (e) => {
        if (this.y0 == null) return;
        const dy = e.clientY - this.y0; this.y0 = null;
        if (dy < -50) go(this.state.i + 1); else if (dy > 50) go(this.state.i - 1);
      },
      dots: I.map((x, k) => ({ aria: '第 ' + (k + 1) + ' 条回放', h: k === st.i ? 22 : 8, c: k === st.i ? '#DCF26A' : 'rgba(244,244,245,.4)', go: () => go(k) })),
      sFollow: st.tab === 'follow' ? 'color:#F4F4F5' : 'color:#8A8A94', sRec: st.tab === 'rec' ? 'color:#F4F4F5' : 'color:#8A8A94',
      pFollow: st.tab === 'follow' ? 'true' : 'false', pRec: st.tab === 'rec' ? 'true' : 'false',
      tFollow: () => this.setState({ tab: 'follow' }), tRec: () => this.setState({ tab: 'rec' }),
      fPressed: fw ? 'true' : 'false', fLabel: fw ? '已关注' : '关注',
      fStyle: fw ? 'background:#2A2A31;color:#B5B5BE' : 'background:#DCF26A;color:#121212',
      follow: () => { this.setState({ followed: { ...this.state.followed, [cur.id]: !fw } }); this.flash(fw ? '已取消关注' : '已关注 ' + cur.name); },
      likes: fmt(cur.likes + (lk ? 1 : 0)), likePressed: lk ? 'true' : 'false', likeFill: lk ? '#FF5C7A' : 'none', likeStroke: lk ? '#FF5C7A' : 'currentColor',
      like: () => this.setState({ liked: { ...this.state.liked, [cur.id]: !lk } }),
      saves: fmt(cur.saves + (sv ? 1 : 0)), savePressed: sv ? 'true' : 'false', saveFill: sv ? '#DCF26A' : 'none', saveStroke: sv ? '#DCF26A' : 'currentColor',
      save: () => { this.setState({ saved: { ...this.state.saved, [cur.id]: !sv } }); this.flash(sv ? '已取消收藏' : '已收藏这条路线'); },
      shares: fmt(cur.shares + (st.shared[cur.id] ? 1 : 0)),
      shareOpen: st.shareOpen, openShare: () => this.setState({ shareOpen: true }), closeShare: () => this.setState({ shareOpen: false }),
      targets,
      hasToast: !!st.toast, toast: st.toast
    };
  }
}
</script>
