<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>领地地图</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Orbitron:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E10}
a{color:#DCF26A;text-decoration:none}a:hover{color:#EAF8A0}
button{font-family:inherit}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<style>

@keyframes cardspin{to{transform:rotate(360deg)}}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.06,.94)}}
</style>
<style>html,body{min-height:100%}body{display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box}#dc-root>div{border-radius:44px;box-shadow:0 20px 60px rgba(0,0,0,.5)}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#121216;color:#F4F4F5;font-family:'Noto Sans SC',system-ui,sans-serif">

<div onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}" onPointerCancel="{{onUp}}" style="position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;touch-action:none;cursor:{{cursor}}">
<div style="position:absolute;left:0;top:0;width:900px;height:1200px;transform-origin:0 0;transform:translate({{px}}px,{{py}}px) scale({{z}});transition:{{trans}}">
<svg width="900" height="1200" viewBox="0 0 900 1200" style="position:absolute;left:0;top:0" aria-hidden="true">
<rect width="900" height="1200" fill="#121216"></rect>
<path d="M-10 640 C 120 600 260 700 400 650 S 640 590 760 640 S 880 700 910 680 L910 760 C 860 770 780 720 700 730 S 520 790 400 760 S 140 700 -10 740 Z" fill="#162330"></path>
<rect x="405" y="276" width="74" height="40" rx="8" fill="#152019"></rect>
<rect x="551" y="740" width="84" height="64" rx="8" fill="#152019"></rect>
<rect x="60" y="300" width="110" height="80" rx="10" fill="#152019"></rect>
<rect x="640" y="980" width="150" height="110" rx="12" fill="#152019"></rect>
<rect x="250" y="40" width="120" height="60" rx="10" fill="#152019"></rect>
<g stroke="#212128" stroke-width="7" fill="none" stroke-linecap="round">
<path d="M-10 70 L910 40"></path><path d="M-10 330 L910 290"></path><path d="M-10 456 L910 436"></path><path d="M-10 790 L910 730"></path><path d="M-10 882 L910 870"></path><path d="M-10 1100 L910 1080"></path>
<path d="M120 -10 L150 1210"></path><path d="M355 -10 L397 1210"></path><path d="M509 -10 L467 1210"></path><path d="M595 -10 L637 1210"></path><path d="M820 -10 L780 1210"></path>
</g>
<g stroke="#1A1A20" stroke-width="2.5" fill="none">
<path d="M-10 200 L910 180"></path><path d="M-10 386 L910 370"></path><path d="M-10 540 L910 510"></path><path d="M-10 960 L910 940"></path>
<path d="M60 -10 L80 1210"></path><path d="M295 -10 L317 1210"></path><path d="M437 -10 L427 1210"></path><path d="M700 -10 L700 1210"></path>
</g>
<g opacity="{{opMine}}">
<path d="M375 510 L460 480 L505 530 L487 600 L405 612 L363 565 Z" fill="#DCF26A" fill-opacity="0.5" stroke="#DCF26A" stroke-width="{{sw.bj}}" stroke-linejoin="round"></path>
<path d="M295 360 L373 348 L385 416 L317 430 Z" fill="#DCF26A" fill-opacity="0.5" stroke="#DCF26A" stroke-width="{{sw.lj}}" stroke-linejoin="round"></path>
<path d="M420 980 L520 970 L530 1050 L430 1060 Z" fill="#DCF26A" fill-opacity="0.5" stroke="#DCF26A" stroke-width="{{sw.nh}}" stroke-linejoin="round"></path>
</g>
<g opacity="{{opClub}}">
<path d="M470 350 L573 330 L603 408 L551 448 L485 430 Z" fill="#B4A3F5" fill-opacity="0.45" stroke="#B4A3F5" stroke-width="{{sw.yp}}" stroke-linejoin="round"></path>
<path d="M640 140 L780 160 L800 260 L680 280 Z" fill="#B4A3F5" fill-opacity="0.45" stroke="#B4A3F5" stroke-width="{{sw.xf}}" stroke-linejoin="round"></path>
</g>
<g opacity="{{opRival}}">
<path d="M269 476 L347 464 L359 530 L325 580 L267 562 Z" fill="#F28DC0" fill-opacity="0.45" stroke="#F28DC0" stroke-width="{{sw.cx}}" stroke-linejoin="round"></path>
<path d="M60 120 L200 100 L220 210 L90 230 Z" fill="#F28DC0" fill-opacity="0.45" stroke="#F28DC0" stroke-width="{{sw.xg}}" stroke-linejoin="round"></path>
<path d="M517 480 L615 468 L627 560 L555 582 L511 540 Z" fill="#FF9F5A" fill-opacity="0.45" stroke="#FF9F5A" stroke-width="{{sw.dg}}" stroke-linejoin="round"></path>
<path d="M600 800 L760 790 L800 900 L700 940 L610 900 Z" fill="#6FD3E8" fill-opacity="0.45" stroke="#6FD3E8" stroke-width="{{sw.nm}}" stroke-linejoin="round"></path>
<path d="M120 830 L240 812 L260 910 L150 940 Z" fill="#6FD3E8" fill-opacity="0.45" stroke="#6FD3E8" stroke-width="{{sw.ba}}" stroke-linejoin="round"></path>
</g>
</svg>

<div style="position:absolute;left:440px;top:530px;width:14px;height:14px" aria-hidden="true">
<div style="position:absolute;left:0;top:0;width:14px;height:14px;border-radius:7px;background:#DCF26A;animation:pulse 1.8s ease-out infinite"></div>
<div style="position:absolute;left:0;top:0;width:14px;height:14px;border-radius:7px;background:#F4F4F5;border:3px solid #121216;box-sizing:border-box"></div>
</div>

<template data-sc="for" list="{{pins}}" as="p" hint-placeholder-count="10">
<button onClick="{{p.pick}}" aria-label="{{p.aria}}" style="position:absolute;left:{{p.x}}px;top:{{p.y}}px;transform:translate(-50%,-50%);height:44px;padding:0;border:0;background:transparent;cursor:pointer;opacity:{{p.op}}">
<span style="height:30px;padding:0 11px;border-radius:15px;border:1.5px solid {{p.color}};background:rgba(14,14,16,.9);color:#F4F4F5;font-size:11px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap"><span style="width:8px;height:8px;border-radius:4px;background:{{p.color}}"></span>{{p.name}}</span>
</button>
</template>
<template data-sc="for" list="{{chests}}" as="c" hint-placeholder-count="3">
<button onClick="{{c.pick}}" aria-label="{{c.aria}}" style="position:absolute;left:{{c.x}}px;top:{{c.y}}px;transform:translate(-50%,-50%);width:44px;height:44px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center">
<span style="width:34px;height:34px;border-radius:11px;background:#FFC857;color:#121212;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(255,200,87,.22);animation:bob 2.2s ease-in-out infinite"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v10H4zM4 10l2-5h12l2 5M12 10v10"></path></svg></span>
</button>
</template>
<template data-sc="for" list="{{venues}}" as="v" hint-placeholder-count="3">
<button onClick="{{v.pick}}" aria-label="{{v.aria}}" style="position:absolute;left:{{v.x}}px;top:{{v.y}}px;transform:translate(-50%,-50%);height:44px;padding:0;border:0;background:transparent;cursor:pointer">
<span style="height:32px;padding:0 10px 0 4px;border-radius:10px;background:#F4F4F5;color:#121212;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap"><span style="width:24px;height:24px;border-radius:7px;background:{{v.color}};display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V9l8-5 8 5v12M9 21v-6h6v6"></path></svg></span>{{v.short}}</span>
</button>
</template>
<a href="Boss.html" aria-label="沙发怪来袭，剩余血量 38%，去讨伐" style="position:absolute;left:430px;top:462px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;animation:bob 2.4s ease-in-out infinite">
<span style="padding:3px;border-radius:12px;background:#FF6A3D;display:block"><template data-sc="import" name="CardArt" art="sofa" w="{{ 48 }}" hint-size="48px,58px"></template></span>
<span style="height:22px;padding:0 8px;border-radius:11px;background:rgba(14,14,16,.92);border:1.5px solid #FF6A3D;color:#FF9F5A;font-size:10px;font-weight:900;display:flex;align-items:center;white-space:nowrap">沙发怪 · 38%</span>
</a>
</div>
</div>

<div style="position:absolute;left:16px;right:16px;top:18px;display:flex;align-items:center;gap:12px">
<div style="width:46px;height:46px;border-radius:23px;background:#B4A3F5;color:#121212;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px">杰</div>
<div style="display:flex;flex-direction:column;gap:2px;flex-grow:1">
<div style="font-size:18px;font-weight:700;letter-spacing:.5px">嗨，阿杰</div>
<div style="font-size:12px;color:#B5B5BE;display:flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="#FFC857" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>今日能量 320 · LV.7</div>
</div>
<a href="Inbox.html" aria-label="消息，5 条未读" style="width:46px;height:46px;border-radius:23px;background:#1F1F25;color:#F4F4F5;position:relative;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg>
<span style="position:absolute;right:12px;top:11px;width:8px;height:8px;border-radius:4px;background:#FF5C7A"></span>
</a>
</div>

<div style="position:absolute;left:16px;right:16px;top:78px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;gap:2px;padding:4px;border-radius:26px;background:rgba(27,27,31,.94)">
<button onClick="{{setCity}}" aria-pressed="{{pCity}}" style="height:40px;padding:0 16px;border:0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;{{chipCity}}">全城</button>
<button onClick="{{setMine}}" aria-pressed="{{pMine}}" style="height:40px;padding:0 16px;border:0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;{{chipMine}}">我的</button>
<button onClick="{{setClub}}" aria-pressed="{{pClub}}" style="height:40px;padding:0 16px;border:0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;{{chipClub}}">跑团</button>
</div>
<a href="Season.html" style="height:44px;padding:0 14px;border-radius:22px;background:rgba(27,27,31,.94);color:#F4F4F5;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px"><span style="font-family:Orbitron,sans-serif;font-weight:700;color:#DCF26A">S3</span>剩 42 天</a>
</div>

<div style="position:absolute;right:16px;top:140px;display:flex;flex-direction:column;gap:8px;align-items:flex-end">
<a href="City.html" style="height:44px;padding:0 14px;border-radius:22px;background:#DCF26A;color:#121212;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V9h3V5h3v3h4V5h3v4h3v12zM10 21v-5h4v5"></path></svg>建城</a>
<a href="Games.html" style="height:44px;padding:0 14px;border-radius:22px;background:#1F1F25;color:#F4F4F5;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9h4M8 7v4M15 10h.01M18 8h.01"></path><path d="M7 4h10a5 5 0 0 1 5 5v2a5 5 0 0 1-5 5h-1l-2 3h-4l-2-3H7a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5z"></path></svg>玩法</a>
<a href="AI.html" aria-label="AI 助手" style="height:44px;padding:0 14px;border-radius:22px;background:#B4A3F5;color:#121212;font-family:Orbitron,sans-serif;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"></path></svg>AI</a>
</div>

<div style="position:absolute;right:16px;top:330px;display:flex;flex-direction:column;gap:8px">
<button onClick="{{zoomIn}}" aria-label="放大地图" style="width:44px;height:44px;border-radius:22px;border:0;background:#1F1F25;color:#F4F4F5;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center">+</button>
<button onClick="{{zoomOut}}" aria-label="缩小地图" style="width:44px;height:44px;border-radius:22px;border:0;background:#1F1F25;color:#F4F4F5;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center">−</button>
<button onClick="{{locate}}" aria-label="回到我的位置" style="width:44px;height:44px;border-radius:22px;border:0;background:#1F1F25;color:#F4F4F5;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
</div>

<template data-sc="if" value="{{showHint}}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;left:16px;top:140px;height:34px;padding:0 12px;border-radius:17px;background:rgba(27,27,31,.94);font-size:12px;color:#D6D6DD;display:flex;align-items:center;gap:6px;pointer-events:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"></path></svg>拖动地图看全城</div>
</template>

<template data-sc="if" value="{{noSel}}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;left:12px;right:12px;bottom:100px;display:flex;flex-direction:column;gap:10px">
<div style="background:#DCF26A;color:#121212;border-radius:28px;padding:18px;display:flex;gap:12px;align-items:center">
<div style="display:flex;flex-direction:column;gap:6px;flex-grow:1;min-width:0">
<div style="font-size:12px;font-weight:700;color:#3D4415">今日挑战</div>
<div style="font-size:21px;font-weight:900;letter-spacing:.5px">守住 滨江公园</div>
<div style="font-size:12px;line-height:1.5;color:#2B300E">「城西跑团」正在靠近 · 20:00 前跑一圈即可加固</div>
<a href="Run.html" style="align-self:flex-start;margin-top:4px;height:42px;padding:0 18px;border-radius:21px;background:#121212;color:#DCF26A;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px">去守地<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
<div style="position:relative;width:88px;height:88px;flex-shrink:0">
<svg width="88" height="88" viewBox="0 0 88 88" role="img" aria-label="守卫值 68"><circle cx="44" cy="44" r="36" fill="none" stroke="rgba(18,18,18,.14)" stroke-width="8"></circle><circle cx="44" cy="44" r="36" fill="none" stroke="#121212" stroke-width="8" stroke-linecap="round" stroke-dasharray="154 226" transform="rotate(-90 44 44)"></circle></svg>
<div style="position:absolute;left:0;top:0;width:88px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-family:Orbitron,sans-serif;font-size:22px;font-weight:800">68</span><span style="font-size:10px;font-weight:500">守卫值</span></div>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<div style="background:#B4A3F5;color:#121212;border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:4px">
<div style="font-size:12px;font-weight:700">我的领地</div>
<div style="display:flex;align-items:baseline;gap:4px"><span style="font-family:Orbitron,sans-serif;font-size:26px;font-weight:800">2.36</span><span style="font-size:12px;font-weight:700">km²</span></div>
<div style="font-size:11px;color:#2A2440">本周 +0.42 km²</div>
</div>
<div style="background:#EBC9F7;color:#121212;border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:4px">
<div style="font-size:12px;font-weight:700">本周被抢</div>
<div style="display:flex;align-items:baseline;gap:4px"><span style="font-family:Orbitron,sans-serif;font-size:26px;font-weight:800">3</span><span style="font-size:12px;font-weight:700">块</span></div>
<div style="font-size:11px;color:#3A2742">已夺回 2 块</div>
</div>
</div>
</div>
</template>

<template data-sc="if" value="{{hasSel}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:12px;right:12px;bottom:100px;background:#1B1B20;border:1px solid #2A2A31;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:10px">
<span style="width:14px;height:14px;border-radius:7px;background:{{cur.color}};flex-shrink:0"></span>
<div style="font-size:20px;font-weight:900;flex-grow:1">{{cur.name}}</div>
<span style="height:26px;padding:0 10px;border-radius:13px;background:#2A2A31;color:#D6D6DD;font-size:11px;display:flex;align-items:center">{{cur.tag}}</span>
<button onClick="{{close}}" aria-label="关闭详情" style="width:40px;height:40px;border-radius:20px;border:0;background:#2A2A31;color:#F4F4F5;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div style="font-size:12px;color:#B5B5BE">{{cur.owner}}</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<template data-sc="for" list="{{cur.stats}}" as="s" hint-placeholder-count="3">
<div style="background:#24242A;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px"><span style="font-size:11px;color:#B5B5BE">{{s.l}}</span><span style="font-size:16px;font-weight:700">{{s.v}}</span></div>
</template>
</div>
<div style="display:flex;gap:10px">
<a href="{{cur.href}}" style="flex-grow:1;height:48px;border-radius:24px;background:#DCF26A;color:#121212;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">{{cur.action}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<a href="{{cur.altHref}}" style="height:48px;padding:0 16px;border-radius:24px;border:1.5px solid #B4A3F5;color:#B4A3F5;font-size:14px;font-weight:700;display:flex;align-items:center">{{cur.alt}}</a>
</div>

<script type="text/x-dc" id="dc-script">
class Component extends DCLogic {
