<!doctype html>

<div style="position:absolute;left:0;top:0;right:0;bottom:0;overflow-y:auto;padding:18px 16px 112px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;scrollbar-width:none">

</div>

</a>

<div style="background:#1B1B20;border:1px solid #2A2A31;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:14px;font-weight:900">钱包与福利</span><span style="font-size:12px;color:#B5B5BE;display:flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="#FFC857" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>1,280 能量</span></div>

</div>

<div style="background:#1B1B20;border:1px solid #232329;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="font-size:16px;font-weight:700">本周 · 11 月第 3 周</span>
<span style="font-size:12px;color:#B5B5BE">共 <span style="font-family:Orbitron,sans-serif;font-weight:700;color:#F4F4F5">18.4</span> km</span>
</div>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">
<template data-sc="for" list="{{days}}" as="d" hint-placeholder-count="7">
<button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" aria-label="{{d.aria}}" style="border:0;background:transparent;color:#F4F4F5;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px">
<span style="height:70px;display:flex;align-items:flex-end"><span style="width:14px;border-radius:7px;height:{{d.h}}px;background:{{d.bar}}"></span></span>
<span style="font-size:11px;color:#B5B5BE">{{d.wd}}</span>
<span style="width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-family:Orbitron,sans-serif;font-size:13px;font-weight:700;{{d.dot}}">{{d.date}}</span>
</button>
</template>
</div>
</div>

<div style="border-radius:24px;padding:16px;display:flex;align-items:center;gap:12px;{{dayCard}}">

</div>

<div style="display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid #26262C">

</button>

</div>

      spiky: { bg: '#EBC9F7', c1: '#FF9F5A', c2: '#FFC857', tail: tailA, back: 'M32 74 L36 64 L40 72 L44 62 L48 71 L52 62 L56 71 L60 64 L62 72 Z', e2x: 66, e2r: 0, e2p: 0 },

    };
    const isChar = chars.indexOf(art) >= 0, isBuild = builds.indexOf(art) >= 0, isBoss = bosses.indexOf(art) >= 0, isPet = !!P[art];
    const is = {};

    const NAMES = { archer: '弓箭手', knight: '骑士', smith: '铁匠', monk: '修士', scout: '斥候', banner: '旗手', alchemist: '药剂师', farmer: '农夫', tower: '瞭望塔', campfire: '篝火', mill: '风车磨坊', chapel: '礼拜堂', well: '水井', tent: '营帐', forge: '铁匠铺', house: '小屋', gecko: '闪电壁虎', axolotl: '云朵螈', frog: '泡泡蛙', spiky: '尖刺蜥', firetail: '火尾蜥', nightnewt: '夜行蝾螈', sofa: '沙发怪', bat: '熬夜蝠', smog: '雾霾眼', sugar: '糖分怪' };

<script type="text/x-dc" id="dc-script">

    const days = raw.map((d, i) => {

      return {

        bar: d.kind === 'run' ? (selected ? '#DCF26A' : '#B4A3F5') : '#2A2A31',
        dot: selected ? 'background:#DCF26A;color:#121212' : (i === 3 ? 'border:1.5px solid #DCF26A;color:#F4F4F5' : 'color:#F4F4F5'),

    return {
      days,

      dayCard: isRun ? 'background:#DCF26A;color:#121212' : 'background:#1B1B20;border:1px solid #232329;color:#F4F4F5',

      daySub: isRun ? 'color:#2B300E' : 'color:#B5B5BE',

      togglePrivacy: () => this.setState({ privacy: !this.state.privacy }),

  }
}
