<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理端 · 内容审核</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E9EB}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid #141414;outline-offset:2px}
.adm-side :focus-visible{outline-color:#FFFFFF}
.adm-side a:hover{background:#26262A}
.adm-side a[aria-current="page"]:hover{background:#FFFFFF}
.adm-btn:hover{background:#2E2E33 !important}
.adm-q:hover{background:#F7F7F8}
.num{font-family:Lexend,'Noto Sans SC',sans-serif}
@media (max-width:760px){
.adm-side{flex:1 1 100% !important;flex-direction:row !important;overflow-x:auto;justify-content:flex-start !important;padding:10px !important}
.adm-side .adm-sp{display:none}
}
</style>


</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="min-height:100vh;background:#E9E9EB;padding:24px;box-sizing:border-box;font-family:'Noto Sans SC',system-ui,sans-serif;color:#141414">
<div style="max-width:1400px;margin:0 auto;background:#FFFFFF;border-radius:32px;padding:20px;display:flex;flex-wrap:wrap;gap:24px;box-sizing:border-box">

<nav class="adm-side" aria-label="管理端导航" style="flex:0 0 84px;background:#141414;border-radius:26px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;box-sizing:border-box">
<div role="img" aria-label="圈圈 Loopland 运营后台" style="width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center"><svg width="48" height="48" viewBox="14 14 72 72" aria-hidden="true"><circle cx="62" cy="50" r="21" fill="#DCF26A"></circle><circle cx="38" cy="50" r="19" fill="none" stroke="#141414" stroke-width="15"></circle><circle cx="38" cy="50" r="19" fill="none" stroke="#FFFFFF" stroke-width="8"></circle><circle cx="38" cy="31" r="5" fill="#B4A3F5" stroke="#141414" stroke-width="2.5"></circle></svg></div>
<div class="adm-sp" style="height:18px"></div>
<a href="AdminHome.html" aria-label="总览" title="总览" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg></a>
<a href="AdminUsers.html" aria-label="用户管理" title="用户管理" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.8-3.6 3.2-5.5 6-5.5s5.2 1.9 6 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2"></path></svg></a>
<a href="AdminPlans.html" aria-label="会员套餐与订单" title="会员套餐与订单" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"></path><path d="M5 19h14"></path></svg></a>
<a href="AdminMap.html" aria-label="地图与领地" title="地图与领地" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"></path></svg></a>
<a href="AdminReview.html" aria-label="内容审核" title="内容审核" aria-current="page" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;background:#FFFFFF;color:#141414;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 13l2 2 4-4"></path></svg></a>
<a href="AdminRisk.html" aria-label="风控防作弊" title="风控防作弊" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M12 8v5M12 16v.5"></path></svg></a>
<a href="AdminMerchant.html" aria-label="商户与活动" title="商户与活动" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v10h16V10M3 10l2-6h14l2 6zM9 20v-5h6v5"></path></svg></a>
<a href="AdminConfig.html" aria-label="玩法配置" title="玩法配置" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></a>
<div class="adm-sp" style="flex-grow:1"></div>
<a href="AdminHome.html" aria-label="退出登录" title="退出登录" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#8E8E95;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"></path></svg></a>
</nav>

<main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:14px">
<div style="flex:1 1 220px;min-width:0">
<h1 style="margin:0;font-size:28px;font-weight:900">内容审核</h1>
<div style="font-size:13px;color:#6B6B72;margin-top:2px">待审 {{left}} 条 · AI 预审已开启 · 动态、评论、跑团名称、头像</div>
</div>
<div style="display:flex;align-items:center;gap:10px">
<div aria-hidden="true" style="width:46px;height:46px;border-radius:23px;background:#EDEDF0;border:1.5px solid #141414;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:700">林</div>
<div style="font-size:13px;line-height:1.3"><div style="font-weight:700">小林</div><div style="color:#6B6B72">运营 · 华东区</div></div>
</div>
</header>

<section aria-label="今日审核数据" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
<div style="background:#F2F2F4;border-radius:22px;padding:16px 18px"><div class="num" style="font-size:30px;font-weight:700">{{done}}</div><div style="font-size:13px;color:#4A4A50">今日已处理</div></div>
<div style="background:#F2F2F4;border-radius:22px;padding:16px 18px"><div class="num" style="font-size:30px;font-weight:700">2m14s</div><div style="font-size:13px;color:#4A4A50">平均处理时长</div></div>
<div style="background:#F2F2F4;border-radius:22px;padding:16px 18px"><div class="num" style="font-size:30px;font-weight:700">93%</div><div style="font-size:13px;color:#4A4A50">AI 预审与人工一致率</div></div>
<div style="background:#F2F2F4;border-radius:22px;padding:16px 18px"><div class="num" style="font-size:30px;font-weight:700">1,204</div><div style="font-size:13px;color:#4A4A50">AI 自动放行（低风险）</div></div>
</section>

<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">

<section aria-labelledby="q-h" style="flex:1 1 340px;min-width:0;border:1.5px solid #ECECEF;border-radius:28px;padding:18px 14px 10px">
<div style="display:flex;align-items:center;gap:8px;padding:0 6px 10px">
<h2 id="q-h" style="margin:0;font-size:18px;font-weight:900;flex-grow:1">审核队列</h2>
<span style="font-size:12px;color:#6B6B72">按 AI 风险分排序</span>
</div>
<div role="tablist" aria-label="内容类型" style="display:flex;flex-wrap:wrap;gap:6px;padding:0 6px 10px">
<template data-sc="for" list="{{types}}" as="t" hint-placeholder-count="5">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height:34px;padding:0 12px;border-radius:17px;font-size:12px;cursor:pointer;{{t.st}}">{{t.label}}</button>
</template>
</div>
<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px">
<template data-sc="for" list="{{queue}}" as="q" hint-placeholder-count="6">
<li>
<button class="adm-q" onClick="{{q.pick}}" aria-pressed="{{q.sel}}" style="width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:18px;cursor:pointer;background:#FFFFFF;{{q.box}}">
<div style="width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;{{q.rst}}"><span class="num" style="font-size:16px;font-weight:700;line-height:1">{{q.risk}}</span><span style="font-size:9px;margin-top:2px">风险</span></div>
<div style="flex:1 1 auto;min-width:0">
<div style="display:flex;gap:6px;align-items:center;font-size:12px;color:#6B6B72"><span style="font-weight:700;color:#141414">{{q.type}}</span>· {{q.user}} · {{q.time}}</div>
<div style="font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{q.text}}</div>
<div style="font-size:12px;color:#4A4A50;margin-top:3px">{{q.top}}</div>
</div>
</button>
</li>
</template>
</ul>
<template data-sc="if" value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding:30px 10px;text-align:center;font-size:14px;color:#6B6B72">这一类已经清空了</div>
</template>
</section>

<template data-sc="if" value="{{hasCur}}" hint-placeholder-val="{{ true }}">
<section aria-labelledby="d-h" style="flex:2 1 520px;min-width:0;background:#F2F2F4;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:12px">
<div aria-hidden="true" style="width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:1.5px solid #141414;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">{{cur.ini}}</div>
<div style="flex-grow:1;min-width:0">
<h2 id="d-h" style="margin:0;font-size:17px;font-weight:900">{{cur.type}} · {{cur.user}}</h2>
<div style="font-size:12px;color:#6B6B72">用户 ID {{cur.uid}} · 历史违规 {{cur.hist}} 次 · {{cur.time}}</div>
</div>
<div style="height:34px;padding:0 14px;border-radius:17px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;{{cur.rst}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l9 16H3zM12 10v4M12 17v.5"></path></svg>AI 风险 {{cur.risk}}</div>
</div>

<div style="background:#FFFFFF;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px">
<p style="margin:0;font-size:15px;line-height:1.6">{{cur.text}}</p>

<template data-sc="if" value="{{cur.isPhoto}}" hint-placeholder-val="{{ true }}">
<div style="position:relative;height:230px;border-radius:16px;overflow:hidden;background:#F7F7F4;border:1.5px solid #ECECEF">
<svg width="100%" height="100%" viewBox="0 0 600 230" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M0 190 H600"></path>
<path d="M30 190 V70 h60 v120 M110 190 V40 h80 v150 M520 190 V90 h60 v100"></path>
<path d="M46 90 h12 M66 90 h12 M46 116 h12 M66 116 h12 M128 64 h16 M156 64 h16 M128 96 h16 M156 96 h16"></path>
<path d="M300 186 v-30 l20 -34 h120 l28 34 h20 v30 z" fill="#FFFFFF"></path>
<circle cx="335" cy="188" r="16" fill="#FFFFFF"></circle><circle cx="450" cy="188" r="16" fill="#FFFFFF"></circle>
<path d="M330 152 l16 -26 h40 v26 z M396 126 h40 l20 26 h-60 z"></path>
<rect x="452" y="160" width="40" height="14" rx="2" fill="#FFFFFF"></rect>
<circle cx="236" cy="78" r="22" fill="#FFFFFF"></circle>
<path d="M228 74 v2 M244 74 v2 M230 88 q6 4 12 0"></path>
<path d="M236 100 v52 M236 116 l-26 18 M236 116 l24 -10 M236 152 l-18 36 M236 152 l20 36"></path>
<circle cx="560" cy="40" r="14"></circle>
</svg>
<template data-sc="for" list="{{cur.boxes}}" as="b" hint-placeholder-count="2">
<div style="position:absolute;left:{{b.x}}%;top:{{b.y}}%;width:{{b.w}}%;height:{{b.h}}%;border-radius:8px;box-sizing:border-box;{{b.st}}">
<span style="position:absolute;left:-2px;top:-26px;height:22px;padding:0 8px;border-radius:11px;background:#141414;color:#FFFFFF;font-size:11px;font-weight:700;display:flex;align-items:center;white-space:nowrap">{{b.label}}</span>
</div>
</template>
</div>
</template>

<template data-sc="if" value="{{cur.isTrack}}" hint-placeholder-val="{{ false }}">
<div style="position:relative;height:230px;border-radius:16px;overflow:hidden;background:#F7F7F4;border:1.5px solid #ECECEF">
<svg width="100%" height="100%" viewBox="0 0 600 230" preserveAspectRatio="xMidYMid meet" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M0 60 H600 M0 170 H600 M150 0 V230 M420 0 V230" stroke="#E2E2E6" stroke-width="10"></path>
<path d="M120 190 C 160 120, 220 200, 280 120 S 380 40, 460 90 S 520 180, 470 196" stroke="#141414" stroke-width="3"></path>
<path d="M90 200 C 100 196, 110 194, 120 190" stroke="{{cur.endColor}}" stroke-width="3" stroke-dasharray="{{cur.endDash}}"></path>
<path d="M470 196 C 455 202, 440 204, 430 204" stroke="{{cur.endColor}}" stroke-width="3" stroke-dasharray="{{cur.endDash}}"></path>
<circle cx="90" cy="200" r="{{cur.endR}}" fill="#FF6A3D" stroke="#141414" stroke-width="2"></circle>
<circle cx="430" cy="204" r="{{cur.endR}}" fill="#141414"></circle>
</svg>
<div style="position:absolute;left:12px;top:12px;height:26px;padding:0 10px;border-radius:13px;background:#141414;color:#FFFFFF;font-size:12px;font-weight:700;display:flex;align-items:center">{{cur.trackNote}}</div>
</div>
</template>
</div>

<div style="background:#FFFFFF;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px">
<h3 style="margin:0;font-size:14px;font-weight:900">AI 预审理由</h3>
<template data-sc="for" list="{{cur.reasons}}" as="r" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:12px">
<div style="flex:1 1 auto;min-width:0;font-size:13px">{{r.t}}</div>
<div aria-hidden="true" style="width:120px;height:6px;border-radius:3px;background:#ECECEF;overflow:hidden;flex-shrink:0"><div style="height:100%;background:#141414;width:{{r.pct}}%"></div></div>
<div class="num" style="width:44px;text-align:right;font-size:13px;font-weight:600">{{r.c}}</div>
</div>
</template>
<div style="font-size:12px;color:#4A4A50;background:#F2F2F4;border-radius:12px;padding:10px 12px">建议：{{cur.advice}}</div>
</div>

<div role="group" aria-label="驳回理由" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
<span style="font-size:13px;color:#4A4A50;margin-right:4px">驳回理由</span>
<template data-sc="for" list="{{reasonsPick}}" as="p" hint-placeholder-count="4">
<button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="height:34px;padding:0 12px;border-radius:17px;font-size:12px;cursor:pointer;{{p.st}}">{{p.label}}</button>
</template>
</div>

<div style="display:flex;flex-wrap:wrap;gap:10px">
<button onClick="{{approve}}" class="adm-btn" style="height:46px;padding:0 24px;border-radius:23px;border:0;background:#141414;color:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer">通过</button>
<template data-sc="if" value="{{cur.canMask}}" hint-placeholder-val="{{ true }}">
<button onClick="{{mask}}" aria-pressed="{{cur.masked}}" style="height:46px;padding:0 20px;border-radius:23px;border:1.5px solid #141414;background:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer">{{cur.maskLabel}}</button>
</template>
<button onClick="{{reject}}" style="height:46px;padding:0 20px;border-radius:23px;border:1.5px solid #141414;background:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer">驳回</button>
<div style="flex-grow:1"></div>
<button onClick="{{ban}}" style="height:46px;padding:0 20px;border-radius:23px;border:1.5px solid #E2E2E6;background:#FFFFFF;color:#A8261B;font-size:14px;font-weight:700;cursor:pointer">驳回并禁言 7 天</button>
</div>
</section>
</template>
<template data-sc="if" value="{{noCur}}" hint-placeholder-val="{{ false }}">
<section style="flex:2 1 520px;min-width:0;background:#F2F2F4;border-radius:28px;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
<svg width="120" height="90" viewBox="0 0 120 90" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="22" y="12" width="76" height="66" rx="10" fill="#FFFFFF"></rect><path d="M42 46l12 12 24-24"></path></svg>
<div style="font-size:18px;font-weight:900">队列已清空</div>
<div style="font-size:13px;color:#4A4A50">新内容进入后会自动出现在左侧</div>
</section>
</template>

</div>

<div aria-live="polite" style="min-height:0">
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div style="display:inline-flex;background:#141414;color:#FFFFFF;border-radius:16px;padding:10px 16px;font-size:13px">{{toast}}</div></template>
</div>

<section aria-labelledby="th-h" style="border:1.5px solid #ECECEF;border-radius:28px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:20px;align-items:center">
<div style="flex:1 1 240px;min-width:0">
<h2 id="th-h" style="margin:0;font-size:16px;font-weight:900">AI 自动处理阈值</h2>
<div style="font-size:12px;color:#6B6B72;margin-top:4px">低于放行线自动通过，高于拦截线自动驳回，中间的进入人工队列</div>
</div>
<label style="flex:1 1 220px;display:flex;flex-direction:column;gap:6px;font-size:13px">
<span>自动放行：风险分 &lt; <b class="num">{{passLine}}</b></span>
<input type="range" min="0" max="50" step="5" value="{{passLine}}" onChange="{{onPass}}" style="accent-color:#141414">
</label>
<label style="flex:1 1 220px;display:flex;flex-direction:column;gap:6px;font-size:13px">
<span>自动拦截：风险分 &gt; <b class="num">{{blockLine}}</b></span>
<input type="range" min="60" max="100" step="5" value="{{blockLine}}" onChange="{{onBlock}}" style="accent-color:#141414">
</label>
<div style="font-size:12px;color:#4A4A50;flex:0 1 200px">预计人工量 <b class="num">{{manual}}</b> 条/天</div>
</section>

</main>
</div>
</div>
</template>
<script type="text/x-dc" id="dc-script">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      items: [
        { id: 'q1', kind: 'post', type: '动态', user: '小鹿', ini: '鹿', uid: '10293', hist: 0, time: '3 分钟前', risk: 82, text: '今晚滨江夜跑 8.2km，顺手拍了路边这台车，太帅了。', photo: true, reasons: [['画面含他人正脸', 0.91], ['车牌号可识别', 0.88]], advice: '打码人脸与车牌后通过' },
        { id: 'q2', kind: 'club', type: '跑团名称', user: '阿强', ini: '强', uid: '55120', hist: 2, time: '6 分钟前', risk: 95, text: '加V领跑鞋五折-城东跑团', reasons: [['名称含导流联系方式', 0.97], ['营销词：五折、领', 0.84]], advice: '驳回，要求修改名称' },
        { id: 'q3', kind: 'post', type: '动态', user: '晨跑王', ini: '晨', uid: '33018', hist: 0, time: '9 分钟前', risk: 67, text: '连续第 30 天晨跑打卡，每天同一条线路。', track: true, reasons: [['轨迹起终点 120m 内重复 18 次，疑似住址', 0.86]], advice: '隐藏起终点 200m 后通过，并提醒用户' },
        { id: 'q4', kind: 'comment', type: '评论', user: '约跑小马', ini: '马', uid: '70455', hist: 1, time: '14 分钟前', risk: 76, text: '周末一起跑吗，加我微信 rp****88', reasons: [['含联系方式', 0.9]], advice: '驳回' },
        { id: 'q5', kind: 'comment', type: '评论', user: '路人甲', ini: '甲', uid: '81230', hist: 0, time: '20 分钟前', risk: 34, text: '这配速是骑车吧？已经举报了', reasons: [['疑似争执', 0.41]], advice: '通过（未见辱骂）' },
        { id: 'q6', kind: 'avatar', type: '头像', user: '江湾骑士团长', ini: '江', uid: '20871', hist: 0, time: '31 分钟前', risk: 22, text: '更换跑团头像', reasons: [['无明显风险', 0.12]], advice: '通过' }
      ],
      type: 'all', sel: 'q1', masked: {}, reason: '隐私', done: 86, pass: 20, block: 90, toast: ''
    };
  }
  componentWillUnmount() { clearTimeout(this.tt); }
  say(m) { clearTimeout(this.tt); this.setState({ toast: m }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2400); }
  resolve(msg) {
    const st = this.state;
    const rest = st.items.filter((i) => i.id !== st.sel);
    const vis = rest.filter((i) => st.type === 'all' || i.kind === st.type).sort((a, b) => b.risk - a.risk);
    this.setState({ items: rest, sel: vis.length ? vis[0].id : null, done: st.done + 1 });
    this.say(msg);
  }
  renderVals() {
    const st = this.state;
    const rStyle = (r) => r >= 80 ? 'background:#141414;color:#FFFFFF' : r >= 50 ? 'background:#FFFFFF;color:#141414;border:2px solid #141414' : 'background:#ECECEF;color:#4A4A50';
    const TY = [['all', '全部'], ['post', '动态'], ['comment', '评论'], ['club', '跑团名称'], ['avatar', '头像']];
    const types = TY.map(([id, label]) => {
      const n = st.items.filter((i) => id === 'all' || i.kind === id).length;
      return { label: label + ' ' + n, on: st.type === id, st: st.type === id ? 'border:1.5px solid #141414;background:#141414;color:#FFFFFF;font-weight:700' : 'border:1.5px solid #E2E2E6;background:#FFFFFF;color:#141414', pick: () => this.setState({ type: id }) };
    });
    const vis = st.items.filter((i) => st.type === 'all' || i.kind === st.type).sort((a, b) => b.risk - a.risk);
    const queue = vis.map((i) => ({
      ...i, sel: st.sel === i.id, rst: rStyle(i.risk),
      top: 'AI：' + i.reasons[0][0],
      box: st.sel === i.id ? 'border:2px solid #141414' : 'border:2px solid transparent',
      pick: () => this.setState({ sel: i.id })
    }));
    const c0 = st.items.find((i) => i.id === st.sel);
    let cur = null;
    if (c0) {
      const m = !!st.masked[c0.id];
      const boxSt = m ? 'border:2px solid #141414;background:repeating-linear-gradient(45deg,#9A9AA0 0 6px,#C9C9CE 6px 12px)' : 'border:2.5px dashed #141414;background:rgba(20,20,20,.04)';
      cur = {
        ...c0, rst: rStyle(c0.risk), masked: m,
        isPhoto: !!c0.photo, isTrack: !!c0.track, canMask: !!(c0.photo || c0.track),
        maskLabel: c0.track ? (m ? '已隐藏起终点' : '隐藏起终点后通过') : (m ? '已打码' : '打码后通过'),
        boxes: [
          { x: 35, y: 22, w: 9, h: 22, label: m ? '人脸 · 已打码' : '人脸', st: boxSt },
          { x: 74, y: 66, w: 9, h: 11, label: m ? '车牌 · 已打码' : '车牌', st: boxSt }
        ],
        endColor: m ? '#B5B5BB' : '#141414', endDash: m ? '4 6' : 'none', endR: m ? 0 : 7,
        trackNote: m ? '起终点 200m 已隐藏' : '起终点可见：疑似住址',
        reasons: c0.reasons.map(([t, c]) => ({ t, c: c.toFixed(2), pct: Math.round(c * 100) }))
      };
    }
    const RP = ['隐私', '广告导流', '联系方式', '辱骂', '其他'];
    const reasonsPick = RP.map((r) => ({ label: r, on: st.reason === r, st: st.reason === r ? 'border:1.5px solid #141414;background:#141414;color:#FFFFFF;font-weight:700' : 'border:1.5px solid #E2E2E6;background:#FFFFFF;color:#141414', pick: () => this.setState({ reason: r }) }));
    const manual = Math.round(1800 * (st.block - st.pass) / 70);
    return {
      left: st.items.length, done: st.done, types, queue, empty: vis.length === 0,
      hasCur: !!cur, noCur: !cur, cur: cur || { boxes: [], reasons: [] }, reasonsPick,
      hasToast: !!st.toast, toast: st.toast,
      passLine: st.pass, blockLine: st.block, manual: manual.toLocaleString('en-US'),
      onPass: (e) => this.setState({ pass: Number(e.target.value) }),
      onBlock: (e) => this.setState({ block: Number(e.target.value) }),
      mask: () => {
        if (!c0) return;
        if (st.masked[c0.id]) { this.resolve('已处理后通过：' + c0.type + ' · ' + c0.user); return; }
        this.setState({ masked: { ...st.masked, [c0.id]: true } });
        this.say(c0.track ? '起终点已隐藏，再点一次即通过' : '已自动打码，再点一次即通过');
      },
      approve: () => c0 && this.resolve('已通过：' + c0.type + ' · ' + c0.user),
      reject: () => c0 && this.resolve('已驳回（' + st.reason + '）：' + c0.type + ' · ' + c0.user + '，已通知用户'),
      ban: () => c0 && this.resolve('已驳回并禁言 7 天：' + c0.user + '，用户可在 App 内申诉')
    };
  }
}
