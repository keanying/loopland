<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理端 · 总览</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E9EB}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
input{font-family:inherit}
:focus-visible{outline:2px solid #141414;outline-offset:2px}
.adm-side :focus-visible{outline-color:#FFFFFF}
.adm-side a:hover{background:#26262A}
.adm-side a[aria-current="page"]:hover{background:#FFFFFF}
.adm-btn:hover{background:#2E2E33 !important}
.adm-row:hover{background:#F7F7F8}
.num{font-family:Lexend,'Noto Sans SC',sans-serif}
@media (max-width:760px){
.adm-side{flex:1 1 100% !important;flex-direction:row !important;overflow-x:auto;justify-content:flex-start !important;padding:10px !important}
.adm-side .adm-sp{display:none}
}
</style>


</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="min-height:100vh;background:#E9E9EB;padding:24px;box-sizing:border-box;font-family:'Noto Sans SC',system-ui,sans-serif;color:#141414">
<div style="max-width:1400px;margin:0 auto;background:#FFFFFF;border-radius:32px;padding:20px;display:flex;flex-wrap:wrap;gap:24px;box-sizing:border-box">

<nav class="adm-side" aria-label="管理端导航" style="flex:0 0 84px;background:#141414;border-radius:26px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;box-sizing:border-box">
<div role="img" aria-label="圈圈 Loopland 运营后台" style="width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center"><svg width="48" height="48" viewBox="14 14 72 72" aria-hidden="true"><circle cx="62" cy="50" r="21" fill="#DCF26A"></circle><circle cx="38" cy="50" r="19" fill="none" stroke="#141414" stroke-width="15"></circle><circle cx="38" cy="50" r="19" fill="none" stroke="#FFFFFF" stroke-width="8"></circle><circle cx="38" cy="31" r="5" fill="#B4A3F5" stroke="#141414" stroke-width="2.5"></circle></svg></div>
<div class="adm-sp" style="height:18px"></div>
<a href="AdminHome.html" aria-label="总览" title="总览" aria-current="page" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;background:#FFFFFF;color:#141414;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg></a>
<a href="AdminUsers.html" aria-label="用户管理" title="用户管理" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.8-3.6 3.2-5.5 6-5.5s5.2 1.9 6 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2"></path></svg></a>
<a href="AdminPlans.html" aria-label="会员套餐与订单" title="会员套餐与订单" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"></path><path d="M5 19h14"></path></svg></a>
<a href="AdminMap.html" aria-label="地图与领地" title="地图与领地" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"></path></svg></a>
<a href="AdminReview.html" aria-label="内容审核" title="内容审核" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 13l2 2 4-4"></path></svg></a>
<a href="AdminRisk.html" aria-label="风控防作弊" title="风控防作弊" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M12 8v5M12 16v.5"></path></svg></a>
<a href="AdminMerchant.html" aria-label="商户与活动" title="商户与活动" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v10h16V10M3 10l2-6h14l2 6zM9 20v-5h6v5"></path></svg></a>
<a href="AdminConfig.html" aria-label="玩法配置" title="玩法配置" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#A9A9AF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></a>
<div class="adm-sp" style="flex-grow:1"></div>
<a href="AdminHome.html" aria-label="退出登录" title="退出登录" style="width:56px;height:56px;flex-shrink:0;border-radius:18px;color:#8E8E95;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"></path></svg></a>
</nav>

<main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:14px">
<div style="flex:1 1 220px;min-width:0">
<h1 style="margin:0;font-size:28px;font-weight:900">总览</h1>
<div style="font-size:13px;color:#6B6B72;margin-top:2px">2026 年 11 月 20 日 · 周五 · S3 冬季赛季第 4 周</div>
</div>
<label style="flex:0 1 320px;min-width:200px;height:46px;border-radius:23px;background:#F2F2F4;display:flex;align-items:center;gap:10px;padding:0 16px;box-sizing:border-box;color:#6B6B72">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input aria-label="搜索" placeholder="搜索用户、领地、动态 ID" style="flex-grow:1;min-width:0;border:0;background:transparent;font-size:14px;outline:none;color:#141414">
</label>
<button aria-label="通知，3 条未读" style="width:46px;height:46px;border-radius:23px;border:0;background:#F2F2F4;color:#141414;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg><span style="position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:5px;background:#E5484D;border:2px solid #F2F2F4"></span></button>
<div style="display:flex;align-items:center;gap:10px">
<div aria-hidden="true" style="width:46px;height:46px;border-radius:23px;background:#EDEDF0;border:1.5px solid #141414;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:700">林</div>
<div style="font-size:13px;line-height:1.3"><div style="font-weight:700">小林</div><div style="color:#6B6B72">运营 · 华东区</div></div>
</div>
</header>

<div style="display:flex;flex-wrap:wrap;gap:20px">

<div style="flex:3 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px">

<section aria-label="欢迎" style="background:#F2F2F4;border-radius:28px;padding:26px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:18px;position:relative;overflow:hidden">
<div style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px;align-items:flex-start">
<h2 style="margin:0;font-size:26px;font-weight:900">早上好，小林</h2>
<p style="margin:0;font-size:14px;line-height:1.6;color:#4A4A50">今天有 <b>{{reviewCount}} 条</b>动态待审核、<b>3 起</b>作弊告警。昨晚城区联赛新增领地 182 km²，比上周同期多 24%。</p>
<a href="AdminReview.html" class="adm-btn" style="margin-top:6px;height:44px;padding:0 22px;border-radius:22px;background:#141414;color:#FFFFFF;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700">开始处理<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
<svg width="230" height="150" viewBox="0 0 230 150" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0">
<path d="M18 128 C 60 118 120 136 212 124"></path>
<path d="M120 40 l20 -6 20 6 20 -6 v58 l-20 6 -20 -6 -20 6 z" fill="#FFFFFF"></path>
<path d="M140 34 v58 M160 40 v58"></path>
<path d="M128 70 q10 -14 22 -4 t24 -8" stroke-dasharray="3 4"></path>
<path d="M166 48 v-16 l12 4 -12 4" fill="#141414"></path>
<path d="M36 112 c-6 -26 12 -44 34 -44 c18 0 30 14 28 34 c-1 10 -10 14 -22 14 h-26 c-8 0 -13 -1 -14 -4z" fill="#FFFFFF"></path>
<circle cx="62" cy="58" r="20" fill="#FFFFFF"></circle>
<circle cx="55" cy="54" r="4.5" fill="#FFFFFF"></circle><circle cx="56" cy="55" r="1.8" fill="#141414"></circle>
<circle cx="71" cy="54" r="4.5" fill="#FFFFFF"></circle><circle cx="72" cy="55" r="1.8" fill="#141414"></circle>
<path d="M57 65 q6 5 12 0"></path>
<path d="M92 96 c10 -8 18 -22 22 -34"></path>
<path d="M110 58 l4 4 M114 56 l2 6 M118 58 l-2 5"></path>
<path d="M36 110 c-12 4 -20 0 -24 -10 c-2 -6 2 -10 6 -8"></path>
<path d="M50 118 l-4 10 M78 118 l4 10"></path>
<path d="M196 70 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"></path>
<path d="M30 30 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z"></path>
</svg>
</section>

<section aria-labelledby="todo-h" style="border:1.5px solid #ECECEF;border-radius:28px;padding:20px 20px 10px">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:8px">
<h2 id="todo-h" style="margin:0;font-size:18px;font-weight:900;flex-grow:1">待处理事项</h2>
<div role="tablist" aria-label="筛选待处理" style="display:flex;gap:6px;background:#F2F2F4;border-radius:22px;padding:4px">
<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="4">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height:36px;padding:0 14px;border:0;border-radius:18px;font-size:13px;cursor:pointer;{{t.st}}">{{t.label}} <span class="num" style="opacity:.6">{{t.n}}</span></button>
</template>
</div>
</div>
<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column">
<template data-sc="for" list="{{todos}}" as="r" hint-placeholder-count="5">
<li class="adm-row" style="display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:18px;border-top:1px solid #F0F0F2">
<div aria-hidden="true" style="width:44px;height:44px;border-radius:14px;background:#F2F2F4;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></div>
<div style="flex:1 1 auto;min-width:0">
<div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.title}}</div>
<div style="font-size:12px;color:#6B6B72;margin-top:2px">{{r.cat}} · {{r.time}}</div>
</div>
<span style="height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;flex-shrink:0;{{r.pst}}"><span aria-hidden="true" style="width:6px;height:6px;border-radius:3px;background:currentColor"></span>{{r.pri}}</span>
<a href="{{r.href}}" class="adm-btn" aria-label="{{r.aria}}" style="height:40px;padding:0 18px;border-radius:20px;background:#141414;color:#FFFFFF;display:inline-flex;align-items:center;font-size:13px;font-weight:700;flex-shrink:0">去处理</a>
</li>
</template>
</ul>
</section>

</div>

<div style="flex:2 1 360px;min-width:0;display:flex;flex-direction:column;gap:20px">

<section aria-labelledby="camp-h" style="background:#F2F2F4;color:#141414;border-radius:28px;padding:20px 22px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:8px">
<h2 id="camp-h" style="margin:0;font-size:16px;font-weight:700;flex-grow:1">进行中的活动</h2>
<button onClick="{{prev}}" aria-label="上一个活动" style="width:40px;height:40px;border-radius:20px;border:1.5px solid #D4D4D8;background:#FFFFFF;color:#141414;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button onClick="{{next}}" aria-label="下一个活动" style="width:40px;height:40px;border-radius:20px;border:1.5px solid #D4D4D8;background:#FFFFFF;color:#141414;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div aria-live="polite" style="display:flex;align-items:center;gap:16px">
<div style="position:relative;width:84px;height:84px;flex-shrink:0">
<svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="34" fill="none" stroke="#E2E2E6" stroke-width="8"></circle><circle cx="42" cy="42" r="34" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-dasharray="{{camp.dash}}" transform="rotate(-90 42 42)"></circle></svg>
<div class="num" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700">{{camp.pct}}%</div>
</div>
<div style="min-width:0;display:flex;flex-direction:column;gap:4px">
<div style="font-size:17px;font-weight:900">{{camp.name}}</div>
<div style="font-size:12px;color:#6B6B72">{{camp.date}}</div>
<div style="font-size:12px;color:#141414;font-weight:700">{{camp.stat}}</div>
</div>
</div>
<div style="display:flex;gap:6px" aria-hidden="true">
<template data-sc="for" list="{{dots}}" as="d" hint-placeholder-count="3"><span style="height:6px;border-radius:3px;{{d.st}}"></span></template>
</div>
</section>

<section aria-label="今日核心指标" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<template data-sc="for" list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background:#F2F2F4;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;align-items:baseline;gap:4px"><span class="num" style="font-size:30px;font-weight:700;letter-spacing:-.5px">{{k.v}}</span><span style="font-size:13px;color:#4A4A50">{{k.u}}</span></div>
<div style="font-size:13px;color:#4A4A50">{{k.label}}</div>
<div style="font-size:12px;display:flex;align-items:center;gap:4px;{{k.dst}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.arrow}}"></path></svg>{{k.delta}}</div>
</div>
</template>
</section>

<section aria-label="新功能：地图风格编辑器" style="background:#F2F2F4;border-radius:28px;padding:20px 22px;display:flex;align-items:center;gap:14px;overflow:hidden">
<div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start">
<span style="height:24px;padding:0 10px;border-radius:12px;background:#141414;color:#FFFFFF;font-size:11px;font-weight:700;display:inline-flex;align-items:center">新功能</span>
<div style="font-size:17px;font-weight:900;line-height:1.35">地图风格编辑器</div>
<div style="font-size:12px;line-height:1.5;color:#4A4A50">标准 · 暗色 · 手绘 · 3D，按城市或活动一键下发到 App</div>
<a href="AdminMap.html" class="adm-btn" style="height:40px;padding:0 18px;border-radius:20px;background:#141414;color:#FFFFFF;display:inline-flex;align-items:center;font-size:13px;font-weight:700">去配置</a>
</div>
<svg width="110" height="110" viewBox="0 0 110 110" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0">
<path d="M10 30 l30 -10 30 10 30 -10 v62 l-30 10 -30 -10 -30 10 z" fill="#FFFFFF"></path>
<path d="M40 20 v62 M70 30 v62"></path>
<path d="M18 62 c10 -12 20 6 30 -6 s18 -14 26 -2 18 4 22 -6" stroke-dasharray="3 4"></path>
<path d="M54 44 l-8 14 h16z" fill="#141414"></path><path d="M54 36 v8"></path>
<circle cx="84" cy="48" r="6" fill="#FFFFFF"></circle>
</svg>
</section>

</div>
</div>

<section aria-labelledby="trend-h" style="border:1.5px solid #ECECEF;border-radius:28px;padding:20px 22px 16px">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px">
<h2 id="trend-h" style="margin:0;font-size:18px;font-weight:900">趋势 · {{metricName}}</h2>
<span style="font-size:12px;color:#6B6B72;flex-grow:1">单位：{{unit}}</span>
<div role="tablist" aria-label="指标" style="display:flex;gap:6px">
<template data-sc="for" list="{{metrics}}" as="m" hint-placeholder-count="3">
<button role="tab" aria-selected="{{m.on}}" onClick="{{m.pick}}" style="height:36px;padding:0 14px;border-radius:18px;font-size:13px;cursor:pointer;{{m.st}}">{{m.label}}</button>
</template>
</div>
<div role="group" aria-label="时间范围" style="display:flex;background:#F2F2F4;border-radius:20px;padding:3px">
<button onClick="{{setWeek}}" aria-pressed="{{isWeek}}" style="height:34px;padding:0 12px;border:0;border-radius:17px;font-size:13px;cursor:pointer;{{weekSt}}">本周</button>
<button onClick="{{setMonth}}" aria-pressed="{{isMonth}}" style="height:34px;padding:0 12px;border:0;border-radius:17px;font-size:13px;cursor:pointer;{{monthSt}}">本月</button>
</div>
<button onClick="{{toggleTable}}" aria-pressed="{{showTable}}" style="height:36px;padding:0 14px;border-radius:18px;border:1.5px solid #E2E2E6;background:#FFFFFF;font-size:13px;cursor:pointer">{{tableLabel}}</button>
</div>

<template data-sc="if" value="{{showChart}}" hint-placeholder-val="{{ true }}">
<div style="position:relative;height:220px;margin-top:8px">
<div aria-hidden="true" style="position:absolute;left:0;right:0;top:30px;border-top:1px dashed #E6E6EA"></div>
<div aria-hidden="true" style="position:absolute;left:0;right:0;top:105px;border-top:1px dashed #E6E6EA"></div>
<div aria-hidden="true" style="position:absolute;left:0;right:0;top:180px;border-top:1px solid #E6E6EA"></div>
<svg width="100%" height="220" viewBox="0 0 1000 220" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;display:block">
<path d="{{area}}" fill="#141414" fill-opacity=".06" stroke="none"></path>
<path d="{{line}}" fill="none" stroke="#141414" stroke-width="2" vector-effect="non-scaling-stroke"></path>
</svg>
<template data-sc="if" value="{{hasHover}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position:absolute;top:10px;bottom:40px;left:{{hov.x}}%;border-left:1px solid #141414;opacity:.25"></div>
</template>
<template data-sc="for" list="{{pts}}" as="p" hint-placeholder-count="7">
<div aria-hidden="true" style="position:absolute;left:{{p.x}}%;top:{{p.y}}px;width:10px;height:10px;border-radius:5px;background:#FFFFFF;border:2px solid #141414;transform:translate(-50%,-50%);box-sizing:border-box"></div>
<template data-sc="if" value="{{p.show}}" hint-placeholder-val="{{ false }}">
<div class="num" aria-hidden="true" style="position:absolute;left:{{p.x}}%;top:{{p.y}}px;transform:translate(-50%,-140%);background:#141414;color:#FFFFFF;font-size:12px;font-weight:600;height:26px;padding:0 10px;border-radius:13px;display:flex;align-items:center;white-space:nowrap">{{p.tip}}</div>
</template>
<button onPointerEnter="{{p.enter}}" onPointerLeave="{{clearHover}}" onFocus="{{p.enter}}" onBlur="{{clearHover}}" aria-label="{{p.aria}}" style="position:absolute;left:{{p.hx}}%;width:{{p.hw}}%;top:0;bottom:30px;border:0;background:transparent;cursor:crosshair;padding:0"></button>
<div style="position:absolute;left:{{p.x}}%;bottom:0;transform:translateX(-50%);font-size:12px;color:#6B6B72;white-space:nowrap">{{p.label}}</div>
</template>
</div>
</template>
<template data-sc="if" value="{{showTable}}" hint-placeholder-val="{{ false }}">
<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px">
<thead><tr><th scope="col" style="text-align:left;padding:8px;color:#6B6B72;font-weight:500;border-bottom:1px solid #ECECEF">日期</th><th scope="col" style="text-align:right;padding:8px;color:#6B6B72;font-weight:500;border-bottom:1px solid #ECECEF">{{metricName}}（{{unit}}）</th></tr></thead>
<tbody>
<template data-sc="for" list="{{pts}}" as="p" hint-placeholder-count="7"><tr><td style="padding:8px;border-bottom:1px solid #F4F4F6">{{p.label}}</td><td class="num" style="padding:8px;text-align:right;border-bottom:1px solid #F4F4F6">{{p.v}}</td></tr></template>
</tbody>
</table>
</template>
</section>

</main>
</div>
</div>
</template>
<script type="text/x-dc" id="dc-script">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all', camp: 0, metric: 'dau', range: 'week', hover: -1, table: false };
  }
  renderVals() {
    const st = this.state;
    const IC = {
      审核: 'M6 3h9l4 4v14H6zM9 13l2 2 4-4',
      风控: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM12 8v5M12 16v.5',
      商户: 'M4 10v10h16V10M3 10l2-6h14l2 6zM9 20v-5h6v5',
      玩法: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12',
      会员: 'M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z'
    };
    const HREF = { 审核: 'AdminReview.dc.html', 风控: 'AdminRisk.dc.html', 商户: 'AdminMerchant.dc.html', 玩法: 'AdminConfig.dc.html', 会员: 'AdminPlans.dc.html' };
    const PRI = {
      高: 'background:#FFE2DC;color:#A8261B',
      中: 'background:#FFF0C2;color:#7A5200',
      低: 'background:#EDEDF0;color:#4A4A50'
    };
    const all = [
      { k: '审核', title: '动态照片含他人正脸与车牌', time: '3 分钟前', pri: '高' },
      { k: '风控', title: '疑似模拟定位：账号「跑跑7721」1 小时圈地 6 块', time: '8 分钟前', pri: '高' },
      { k: '风控', title: '骑行 31 km/h 被记录为跑步，已自动冻结领地', time: '21 分钟前', pri: '中' },
      { k: '会员', title: '退款申请：阿强 · 季卡 ¥45', time: '25 分钟前', pri: '中' },
      { k: '商户', title: '青柠茶铺 · 滨江补给站核销量异常 +38%', time: '40 分钟前', pri: '中' },
      { k: '审核', title: '跑团名称疑似导流广告', time: '1 小时前', pri: '低' },
      { k: '玩法', title: 'S3 赛季掉落表改动待复核', time: '2 小时前', pri: '低' }
    ];
    const tabsDef = [['all', '全部'], ['审核', '审核'], ['风控', '风控'], ['商户', '商户']];
    const tabs = tabsDef.map(([id, label]) => ({
      label, on: st.tab === id,
      n: id === 'all' ? all.length : all.filter((r) => r.k === id).length,
      st: st.tab === id ? 'background:#141414;color:#FFFFFF;font-weight:700' : 'background:transparent;color:#4A4A50',
      pick: () => this.setState({ tab: id })
    }));
    const todos = all.filter((r) => st.tab === 'all' || r.k === st.tab).slice(0, 5).map((r) => ({
      ...r, cat: r.k === '审核' ? '内容审核' : r.k === '玩法' ? '玩法配置' : r.k === '会员' ? '会员订单' : r.k,
      icon: IC[r.k], href: HREF[r.k], pst: PRI[r.pri], pri: r.pri + '优先',
      aria: '去处理：' + r.title
    }));

    const camps = [
      { name: 'S3 冬季赛季', date: '11/01 – 12/31 · 全国', stat: '参与 21.4 万人 · 已圈 3,860 km²', pct: 66 },
      { name: '城区联赛 · 第 4 周', date: '11/17 – 11/23 · 12 城', stat: '跑团 1,280 支 · 对抗 9,400 场', pct: 57 },
      { name: '青柠茶铺 · 冬日暖跑', date: '11/10 – 12/10 · 补给站 86 个', stat: '核销 1.9 万杯 · 拉新 6,200', pct: 41 }
    ];
    const c = camps[st.camp];
    const circ = 2 * Math.PI * 34;
    const camp = { ...c, dash: (circ * c.pct / 100).toFixed(1) + ' ' + circ.toFixed(1) };
    const dots = camps.map((_, i) => ({ st: i === st.camp ? 'width:22px;background:#141414' : 'width:6px;background:#C9C9CE' }));

    const up = 'M12 19V5M6 11l6-6 6 6';
    const down = 'M12 5v14M6 13l6 6 6-6';
    const kpis = [
      { v: '4.8', u: '万', label: '今日活跃用户', delta: '+6.2% 较上周五', arrow: up, dst: 'color:#2F6B1F' },
      { v: '3.16', u: '万次', label: '今日运动记录', delta: '+4.1% 较上周五', arrow: up, dst: 'color:#2F6B1F' },
      { v: '182', u: 'km²', label: '新增领地', delta: '+24% 较上周五', arrow: up, dst: 'color:#2F6B1F' },
      { v: String(all.filter((r) => r.k === '审核').length * 6), u: '条', label: '待审核动态', delta: '-3 较 1 小时前', arrow: down, dst: 'color:#4A4A50' }
    ];

    const DATA = {
      dau: { name: '活跃用户', unit: '万人', week: [4.1, 4.3, 3.9, 4.6, 4.4, 5.6, 4.8], month: [3.6, 4.0, 4.4, 4.7] },
      km: { name: '跑量', unit: '万 km', week: [8.2, 8.9, 7.6, 9.4, 9.1, 13.2, 10.6], month: [52, 58, 63, 66] },
      land: { name: '新增领地', unit: 'km²', week: [120, 138, 102, 151, 146, 236, 182], month: [820, 910, 1040, 1105] }
    };
    const D = DATA[st.metric];
    const vals = D[st.range];
    const labels = st.range === 'week' ? ['11/14 周六', '11/15 周日', '11/16 周一', '11/17 周二', '11/18 周三', '11/19 周四', '11/20 周五'] : ['第 1 周', '第 2 周', '第 3 周', '第 4 周'];
    const n = vals.length;
    const lo = Math.min(...vals) * 0.8, hi = Math.max(...vals) * 1.08;
    const X = (i) => 50 + (i * 900) / (n - 1);
    const Y = (v) => 30 + (1 - (v - lo) / (hi - lo)) * 150;
    const P = vals.map((v, i) => [X(i), Y(v)]);
    let d = 'M' + P[0][0].toFixed(1) + ' ' + P[0][1].toFixed(1);
    for (let i = 0; i < n - 1; i++) {
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ' C' + c1.map((x) => x.toFixed(1)).join(' ') + ' ' + c2.map((x) => x.toFixed(1)).join(' ') + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    const area = d + ' L' + X(n - 1) + ' 180 L' + X(0) + ' 180 Z';
    const maxI = vals.indexOf(Math.max(...vals));
    const fmt = (v) => (v >= 100 ? v.toLocaleString('en-US') : String(v));
    const pts = vals.map((v, i) => {
      const x = X(i) / 10;
      const show = st.hover >= 0 ? st.hover === i : (i === maxI || i === n - 1);
      return {
        x, y: Y(v), v: fmt(v), label: labels[i], show,
        tip: fmt(v) + ' ' + D.unit,
        hx: Math.max(0, x - 50 / n), hw: 100 / n,
        aria: labels[i] + ' ' + D.name + ' ' + fmt(v) + ' ' + D.unit,
        enter: () => this.setState({ hover: i })
      };
    });

    const metrics = [['dau', '活跃'], ['km', '跑量'], ['land', '新增领地']].map(([id, label]) => ({
      label, on: st.metric === id,
      st: st.metric === id ? 'border:1.5px solid #141414;background:#141414;color:#FFFFFF;font-weight:700' : 'border:1.5px solid #E2E2E6;background:#FFFFFF;color:#141414',
      pick: () => this.setState({ metric: id, hover: -1 })
    }));
    const on = 'background:#FFFFFF;color:#141414;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)';
    const off = 'background:transparent;color:#6B6B72';

    return {
      reviewCount: kpis[3].v,
      tabs, todos, camp, dots, kpis, pts, area, line: d,
      metrics, metricName: D.name, unit: D.unit,
      isWeek: st.range === 'week', isMonth: st.range === 'month',
      weekSt: st.range === 'week' ? on : off, monthSt: st.range === 'month' ? on : off,
      setWeek: () => this.setState({ range: 'week', hover: -1 }),
      setMonth: () => this.setState({ range: 'month', hover: -1 }),
      hasHover: st.hover >= 0 && st.hover < n,
      hov: { x: st.hover >= 0 && st.hover < n ? X(st.hover) / 10 : 0 },
      clearHover: () => this.setState({ hover: -1 }),
      showTable: st.table, showChart: !st.table,
      tableLabel: st.table ? '看图表' : '看表格',
      toggleTable: () => this.setState({ table: !st.table }),
      prev: () => this.setState({ camp: (st.camp + camps.length - 1) % camps.length }),
      next: () => this.setState({ camp: (st.camp + 1) % camps.length })
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
