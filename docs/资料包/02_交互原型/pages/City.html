<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>建城</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Orbitron:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E10}
a{color:#DCF26A;text-decoration:none}a:hover{color:#EAF8A0}
button{font-family:inherit}
button:disabled{cursor:not-allowed}
div::-webkit-scrollbar{display:none}
</style>
<style>

@keyframes cardspin{to{transform:rotate(360deg)}}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.06,.94)}}
</style>
<style>html,body{min-height:100%}body{display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box}#dc-root>div{border-radius:44px;box-shadow:0 20px 60px rgba(0,0,0,.5)}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0E0E10;color:#F4F4F5;font-family:'Noto Sans SC',system-ui,sans-serif">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;overflow-y:auto;padding:18px 16px 112px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;scrollbar-width:none">

<div style="display:flex;align-items:center;gap:12px">
<a href="Main.html" aria-label="返回领地地图" style="width:44px;height:44px;border-radius:22px;background:#1F1F25;color:#F4F4F5;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display:flex;flex-direction:column;gap:2px;flex-grow:1">
<h1 style="margin:0;font-size:24px;font-weight:900;letter-spacing:1px">建城</h1>
<div style="font-size:12px;color:#B5B5BE">在你的领地上盖建筑、派角色驻守</div>
</div>
<div style="height:40px;padding:0 12px;border-radius:20px;background:#1F1F25;display:flex;align-items:center;gap:6px;font-size:13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="#FFC857" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg><span style="font-family:Orbitron,sans-serif;font-weight:700">{{energyText}}</span></div>
</div>

<div style="display:flex;gap:6px">
<template data-sc="for" list="{{terrs}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="height:38px;padding:0 14px;border-radius:19px;border:0;cursor:pointer;font-size:13px;font-weight:700;{{t.st}}">{{t.name}}</button>
</template>
</div>

<div style="background:#DCF26A;color:#121212;border-radius:28px;padding:16px 18px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:flex-end;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;font-weight:700;color:#3D4415">{{cur.name}} · {{cur.area}} km²</span><span style="font-size:22px;font-weight:900">{{cur.title}}</span></div>
<span style="height:28px;padding:0 10px;border-radius:14px;background:#121212;color:#DCF26A;font-size:12px;font-weight:700;display:flex;align-items:center">城池 Lv.{{lv}}</span>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<div style="background:rgba(18,18,18,.08);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-family:Orbitron,sans-serif;font-size:20px;font-weight:800">{{guard}}</span><span style="font-size:11px;font-weight:700">守卫值</span></div>
<div style="background:rgba(18,18,18,.08);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-family:Orbitron,sans-serif;font-size:20px;font-weight:800">+{{daily}}</span><span style="font-size:11px;font-weight:700">能量 / 天</span></div>
<div style="background:rgba(18,18,18,.08);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px"><span style="font-family:Orbitron,sans-serif;font-size:20px;font-weight:800">{{heroCount}}/{{cap}}</span><span style="font-size:11px;font-weight:700">驻守角色</span></div>
</div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:16px;font-weight:900">建造位</span><span style="font-size:12px;color:#B5B5BE">{{used}} / 6 已建</span></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<template data-sc="for" list="{{slots}}" as="s" hint-placeholder-count="6">
<template data-sc="if" value="{{s.filled}}" hint-placeholder-val="{{ true }}">
<button onClick="{{s.tap}}" aria-label="{{s.aria}}" style="border:0;background:#1B1B20;border-radius:18px;padding:6px 6px 8px;cursor:pointer;color:#F4F4F5;display:flex;flex-direction:column;align-items:center;gap:6px">
<template data-sc="import" name="CardArt" art="{{s.art}}" w="{{ 98 }}" hint-size="98px,118px"></template>
<span style="font-size:12px;font-weight:700">{{s.name}}</span>
</button>
</template>
<template data-sc="if" value="{{s.empty}}" hint-placeholder-val="{{ false }}">
<button onClick="{{s.tap}}" aria-label="在空位建造" style="border:1.5px dashed #3A3A42;background:transparent;border-radius:18px;min-height:150px;cursor:pointer;color:#B5B5BE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>建造</button>
</template>
</template>
</div>

<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:16px;font-weight:900">驻守角色</span><button onClick="{{openHero}}" style="height:34px;padding:0 12px;border-radius:17px;border:1.5px solid #3A3A42;background:transparent;color:#F4F4F5;font-size:12px;font-weight:700;cursor:pointer">派遣角色</button></div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<template data-sc="for" list="{{heroes}}" as="h" hint-placeholder-count="2">
<button onClick="{{h.remove}}" aria-label="{{h.aria}}" style="border:0;background:#1B1B20;border-radius:16px;padding:5px 5px 6px;cursor:pointer;color:#F4F4F5;display:flex;flex-direction:column;align-items:center;gap:4px">
<template data-sc="import" name="CardArt" art="{{h.art}}" w="{{ 64 }}" hint-size="64px,77px"></template>
<span style="font-size:11px;font-weight:700">{{h.name}}</span>
</button>
</template>
<template data-sc="if" value="{{noHero}}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;color:#8A8A94;padding:8px 0">还没有角色驻守，派一个去守城吧</div></template>
</div>

<div style="background:#1B1B20;border:1px solid #232329;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:900">当前加成</span>
<template data-sc="for" list="{{buffs}}" as="b" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#D6D6DD"><span style="width:8px;height:8px;border-radius:4px;background:{{b.c}};flex-shrink:0"></span>{{b.t}}</div></template>
</div>
</div>

<nav aria-label="主导航" style="position:absolute;left:12px;bottom:12px;width:366px;height:92px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))"><svg width="366" height="92" viewBox="0 0 366 92" aria-hidden="true" style="position:absolute;left:0;top:0;display:block"><path d="M37 18 H 112 C 138 18, 150 2, 183 2 C 216 2, 228 18, 254 18 H 329 A 37 37 0 0 1 329 92 H 37 A 37 37 0 0 1 37 18 Z" fill="#1B1B20" stroke="#2C2C34" stroke-width="1"></path></svg><a href="Main.html" aria-label="领地" aria-current="page" style="position:absolute;left:22px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#FFFFFF;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:1"></span></a><a href="Codex.html" aria-label="图鉴" style="position:absolute;left:88px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7C7C86;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h11v15H8zM5 6v15h11"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:0"></span></a><a href="Club.html" aria-label="社区" style="position:absolute;left:230px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7C7C86;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:0"></span></a><a href="Profile.html" aria-label="我的" style="position:absolute;left:296px;top:31px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7C7C86;text-decoration:none"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.2-6.5 8-6.5s7 2.5 8 6.5"></path></svg><span aria-hidden="true" style="width:5px;height:5px;border-radius:3px;background:#DCF26A;opacity:0"></span></a><a href="Sports.html" aria-label="开始运动" style="position:absolute;left:149px;top:6px;width:68px;height:68px;border-radius:34px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:linear-gradient(#1B1B20,#1B1B20) padding-box,linear-gradient(140deg,#B4A3F5,#DCF26A) border-box;border:3px solid transparent;box-shadow:0 0 22px rgba(180,163,245,.45);color:#FFFFFF;text-decoration:none"><svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true" style="position:absolute;left:-10px;top:-10px;pointer-events:none"><circle cx="44" cy="44" r="41" fill="none" stroke="#B4A3F5" stroke-width="2" stroke-dasharray="1.5 9" stroke-linecap="round" opacity=".75"><animateTransform attributeName="transform" type="rotate" from="0 44 44" to="360 44 44" dur="14s" repeatCount="indefinite"></animateTransform></circle></svg><svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true" style="position:relative;overflow:visible"><g stroke="#141414" stroke-linecap="round" stroke-linejoin="round"><path d="M5 30h7M3 37h8M6 44h6" stroke="#DCF26A" stroke-width="2.4"></path><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="0.32s" repeatCount="indefinite"></animateTransform><g><animateTransform attributeName="transform" type="rotate" values="28 27 40;-28 27 40;28 27 40" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M27 40 L24 50 L28 52" fill="none" stroke-width="3.4"></path><path d="M27 40 L24 50 L28 52" fill="none" stroke="#E0A33A" stroke-width="1.4"></path></g><g><animateTransform attributeName="transform" type="rotate" values="-28 39 39;28 39 39;-28 39 39" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M39 39 L42 49 L46 49" fill="none" stroke-width="3.4"></path><path d="M39 39 L42 49 L46 49" fill="none" stroke="#E0A33A" stroke-width="1.4"></path></g><path d="M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39" fill="none" stroke-width="6"></path><path d="M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39" fill="none" stroke="#FFC857" stroke-width="3"><animate attributeName="d" values="M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39;M22 37 C 15 37, 12 41, 7 39 C 4 38, 4 35, 7 35;M22 37 C 15 39, 12 33, 7 35 C 4 36, 4 39, 7 39" dur="0.64s" repeatCount="indefinite"></animate></path><ellipse cx="32" cy="36" rx="12" ry="7.5" transform="rotate(-14 32 36)" fill="#FFC857" stroke-width="2.2"></ellipse><circle cx="28" cy="35" r="1.8" fill="#FF6A3D" stroke="none"></circle><circle cx="34" cy="32.5" r="1.5" fill="#FF6A3D" stroke="none"></circle><g><animateTransform attributeName="transform" type="rotate" values="-30 30 41;30 30 41;-30 30 41" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M30 41 L27 51 L31 53" fill="none" stroke-width="3.6"></path><path d="M30 41 L27 51 L31 53" fill="none" stroke="#FFC857" stroke-width="1.6"></path></g><g><animateTransform attributeName="transform" type="rotate" values="30 41 38;-30 41 38;30 41 38" dur="0.64s" repeatCount="indefinite"></animateTransform><path d="M41 38 L45 47 L49 46" fill="none" stroke-width="3.6"></path><path d="M41 38 L45 47 L49 46" fill="none" stroke="#FFC857" stroke-width="1.6"></path></g><circle cx="45" cy="25" r="9" fill="#FFC857" stroke-width="2.2"></circle><circle cx="48" cy="22" r="4.2" fill="#FFFFFF" stroke-width="1.6"></circle><circle cx="49.3" cy="22" r="2" fill="#141414" stroke="none"></circle><path d="M46 30 Q 50 32.5 53.5 28.5" fill="none" stroke-width="1.8"></path><path d="M38 18 l3 -4 1 3 3 -3" fill="none" stroke="#DCF26A" stroke-width="2"></path></g></g></svg></a></nav>

<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position:absolute;left:50%;top:72px;transform:translateX(-50%);height:40px;padding:0 16px;border-radius:20px;background:#F4F4F5;color:#121212;font-size:13px;font-weight:700;display:flex;align-items:center;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)">{{toast}}</div>
</template>

<template data-sc="if" value="{{buildOpen}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;flex-direction:column;justify-content:flex-end">
<div role="dialog" aria-label="选择建筑" style="background:#1B1B20;border-top-left-radius:32px;border-top-right-radius:32px;padding:18px 16px 28px;display:flex;flex-direction:column;gap:10px;max-height:640px;overflow-y:auto;scrollbar-width:none">
<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:18px;font-weight:900">选择建筑</span><button onClick="{{closeBuild}}" aria-label="关闭" style="width:40px;height:40px;border-radius:20px;border:0;background:#2A2A31;color:#F4F4F5;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<template data-sc="for" list="{{catalog}}" as="b" hint-placeholder-count="5">
<div style="background:#24242A;border-radius:18px;padding:8px 10px;display:flex;align-items:center;gap:10px">
<template data-sc="import" name="CardArt" art="{{b.art}}" w="{{ 52 }}" locked="{{b.locked}}" hint-size="52px,62px"></template>
<span style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0"><span style="font-size:14px;font-weight:700">{{b.name}}</span><span style="font-size:11px;color:#C9C9D1;line-height:1.4">{{b.effect}}</span></span>
<button onClick="{{b.build}}" disabled="{{b.disabled}}" style="height:36px;padding:0 12px;border-radius:18px;border:0;cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;flex-shrink:0;{{b.btn}}">{{b.label}}</button>
</div>
</template>
</div>
</div>
</template>

<template data-sc="if" value="{{heroOpen}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;flex-direction:column;justify-content:flex-end">
<div role="dialog" aria-label="派遣角色" style="background:#1B1B20;border-top-left-radius:32px;border-top-right-radius:32px;padding:18px 16px 28px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:18px;font-weight:900">派遣角色 · {{heroCount}}/{{cap}}</span><button onClick="{{closeHero}}" aria-label="关闭" style="width:40px;height:40px;border-radius:20px;border:0;background:#2A2A31;color:#F4F4F5;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<template data-sc="for" list="{{roster}}" as="r" hint-placeholder-count="6">
<button onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="border-radius:16px;padding:6px 4px 8px;cursor:pointer;color:#F4F4F5;display:flex;flex-direction:column;align-items:center;gap:4px;{{r.box}}">
<template data-sc="import" name="CardArt" art="{{r.art}}" w="{{ 80 }}" hint-size="80px,96px"></template>
<span style="font-size:12px;font-weight:700">{{r.name}}</span>
<span style="font-size:10px;color:#C9C9D1;text-align:center;line-height:1.3;padding:0 2px">{{r.effect}}</span>
</button>
</template>
</div>
<a href="Codex.html" style="height:44px;border-radius:22px;border:1.5px solid #3A3A42;color:#F4F4F5;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">去图鉴看看怎么招募更多角色</a>
</div>
</div>
</template>
</div>
</template>
<template data-dc-name="CardArt">

<div role="img" aria-label="{{label}}" style="width:{{w}}px;height:{{h}}px;border-radius:{{r}}px;overflow:hidden;position:relative;background:{{bg}};border:2px solid #121212;box-sizing:border-box">
<svg width="100%" height="100%" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:block">
<defs><filter id="cardsil"><feColorMatrix type="matrix" values="0 0 0 0 0.18  0 0 0 0 0.18  0 0 0 0 0.21  0 0 0 0.95 0"></feColorMatrix></filter></defs>

<template data-sc="if" value="{{landscape}}" hint-placeholder-val="{{ true }}">
<g stroke="#121212" stroke-width="2" stroke-linejoin="round">
<path d="M8 34 a7 7 0 0 1 12 -5 a9 9 0 0 1 16 2 a6 6 0 0 1 3 10 H10 a6 6 0 0 1 -2 -7 Z" fill="#F4F4F5"></path>
<path d="M66 22 a6 6 0 0 1 10 -4 a8 8 0 0 1 14 2 a5 5 0 0 1 2 9 H68 a5 5 0 0 1 -2 -7 Z" fill="#F4F4F5"></path>
<path d="M-4 96 Q 26 80 56 90 T 104 86 L104 124 L-4 124 Z" fill="#9BD84A"></path>
<path d="M14 108 q4 -6 8 0 M74 104 q4 -6 8 0" fill="none"></path>
</g>
</template>
<template data-sc="if" value="{{isPet}}" hint-placeholder-val="{{ false }}">
<g stroke="#121212" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M12 22 l5 7 M20 16 l2 9 M84 18 l-4 8 M90 28 l-7 4 M16 112 h14 M70 112 h18"></path></g>
</template>
<template data-sc="if" value="{{isBoss}}" hint-placeholder-val="{{ false }}">
<g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="2"><path d="M8 18 l6 -4 l2 6 l6 -4" stroke="#FF9F5A"></path><path d="M78 14 l4 6 l5 -5 l4 6" stroke="#FFC857"></path><path d="M10 104 l6 -5 l3 6 l6 -5" stroke="#FFC857"></path><path d="M80 106 l5 -6 l3 6" stroke="#FF9F5A"></path><circle cx="20" cy="40" r="1.6" fill="#FFC857" stroke="none"></circle><circle cx="86" cy="44" r="1.6" fill="#FF9F5A" stroke="none"></circle></g>
</template>

<g filter="{{sil}}" stroke="#121212" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">

<template data-sc="if" value="{{is.archer}}" hint-placeholder-val="{{ true }}">
<path d="M70 40 Q 90 68 70 96" fill="none" stroke-width="5"></path><path d="M70 40 Q 90 68 70 96" fill="none" stroke="#B9783E" stroke-width="3"></path><path d="M70 40 L70 96" stroke-width="0.8" fill="none"></path>
<rect x="41" y="88" width="7" height="12" rx="2" fill="#2A2A31"></rect><rect x="52" y="88" width="7" height="12" rx="2" fill="#2A2A31"></rect>
<rect x="36" y="56" width="28" height="36" rx="9" fill="#5BBF6A"></rect><rect x="36" y="74" width="28" height="4" fill="#B9783E"></rect>
<circle cx="50" cy="44" r="13" fill="#F6D2B0"></circle>
<path d="M35 47 C 32 26 68 26 65 47 C 62 38 38 38 35 47 Z" fill="#5BBF6A"></path><path d="M50 27 L60 18" fill="none"></path><path d="M60 18 L66 16 L63 22 Z" fill="#FF6A3D"></path>
<circle cx="45.5" cy="46" r="1.6" fill="#121212" stroke="none"></circle><circle cx="54.5" cy="46" r="1.6" fill="#121212" stroke="none"></circle><path d="M47 52 h6" fill="none"></path>

    const isChar = chars.indexOf(art) >= 0, isBuild = builds.indexOf(art) >= 0, isBoss = bosses.indexOf(art) >= 0, isPet = !!P[art];
    const is = {};
    chars.concat(builds, bosses).forEach((k) => { is[k] = k === art; });
    const NAMES = { archer: '弓箭手', knight: '骑士', smith: '铁匠', monk: '修士', scout: '斥候', banner: '旗手', alchemist: '药剂师', farmer: '农夫', tower: '瞭望塔', campfire: '篝火', mill: '风车磨坊', chapel: '礼拜堂', well: '水井', tent: '营帐', forge: '铁匠铺', house: '小屋', gecko: '闪电壁虎', axolotl: '云朵螈', frog: '泡泡蛙', spiky: '尖刺蜥', firetail: '火尾蜥', nightnewt: '夜行蝾螈', sofa: '沙发怪', bat: '熬夜蝠', smog: '雾霾眼', sugar: '糖分怪' };
    let bg = '#6FD3E8';
    if (isPet) bg = P[art].bg;
    if (isBoss) bg = '#1B1B20';
    if (locked) bg = '#24242A';
    return {
      w, h: Math.round(w * 1.2), r: Math.max(8, Math.round(w * 0.1)),
      bg, is, isPet, isBoss,
      landscape: (isChar || isBuild) && !locked,
      pet: isPet ? P[art] : P.gecko,
      sil: locked ? 'url(#cardsil)' : 'none',
      locked, lockSize: Math.round(w * 0.3), lockFont: Math.round(w * 0.16),
      label: locked ? '未解锁的卡牌' : (NAMES[art] || art)
    };
  }
}
</script>
<script type="text/x-dc" id="dc-script">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      terr: 'bj', energy: 1280, buildSlot: null, heroOpen: false, toast: '',
      slots: { bj: ['tower', 'campfire', 'house', null, null, null], lj: ['tower', 'mill', 'campfire', 'well', null, null], nh: ['campfire', null, null, null, null, null] },
      heroes: { bj: ['archer', 'monk'], lj: ['archer', 'farmer', 'alchemist'], nh: [] }
    };
  }
  componentWillUnmount() { clearTimeout(this.tt); }
  flash(m) { clearTimeout(this.tt); this.setState({ toast: m }); this.tt = setTimeout(() => this.setState({ toast: '' }), 1800); }
  renderVals() {
    const st = this.state;
    const TR = {
      bj: { name: '滨江公园', area: '0.42', title: '滨江要塞', base: 52 },
      lj: { name: '老街口', area: '0.18', title: '老街哨站', base: 60 },
      nh: { name: '南湖步道', area: '0.21', title: '南湖营地', base: 48 }
    };
    const B = {
      tower: { name: '瞭望塔', cost: 300, effect: '守卫值 +20%' },
      campfire: { name: '篝火', cost: 150, effect: '每天 +30 能量' },
      mill: { name: '风车磨坊', cost: 400, effect: '步数转化能量 ×1.2' },
      well: { name: '水井', cost: 200, effect: '伙伴孵化 +20%' },
      house: { name: '小屋', cost: 250, effect: '驻守上限 +1' },
      chapel: { name: '礼拜堂', cost: 0, effect: '被抢后 24 小时内跑半圈即可夺回', locked: '黄金段位解锁' },
      tent: { name: '营帐', cost: 0, effect: '跑团集结点，集结跑能量 ×1.5', locked: '跑团 Lv.5 解锁' },
      forge: { name: '铁匠铺', cost: 0, effect: '角色在这里升级', locked: '招募铁匠后解锁' }
    };
    const H = {
      archer: { name: '弓箭手', effect: '守卫 +8', g: 8 },
      knight: { name: '骑士', effect: '骑行圈地 +10%', g: 4 },
      monk: { name: '修士', effect: '被抢后自动回复', g: 5 },
      scout: { name: '斥候', effect: '视野 +1 km', g: 3 },
      alchemist: { name: '药剂师', effect: '跟练能量 +20%', g: 3 },
      farmer: { name: '农夫', effect: '步数转能量', g: 3 }
    };
    const t = st.terr;
    const sl = st.slots[t];
    const hs = st.heroes[t];
    const count = (k) => sl.filter((x) => x === k).length;
    const cap = 2 + count('house');
    const base = TR[t].base + hs.reduce((n, k) => n + H[k].g, 0);
    const guard = Math.round(base * (1 + 0.2 * count('tower')));
    const daily = 30 * count('campfire') + (count('mill') ? 20 : 0);
    const used = sl.filter((x) => x).length;
    const lv = 1 + Math.floor(used / 2);
    const chipOn = 'background:#DCF26A;color:#121212';
    const chipOff = 'background:#1F1F25;color:#C9C9D1';
    const terrs = Object.keys(TR).map((k) => ({ name: TR[k].name, pressed: k === t ? 'true' : 'false', st: k === t ? chipOn : chipOff, pick: () => this.setState({ terr: k }) }));
    const slots = sl.map((a, i) => ({
      art: a || 'tower', filled: !!a, empty: !a, name: a ? B[a].name : '',
      aria: a ? B[a].name + '，' + B[a].effect : '空建造位',
      tap: () => { if (a) this.flash(B[a].name + ' · ' + B[a].effect); else this.setState({ buildSlot: i }); }
    }));
    const catalog = Object.keys(B).map((k) => {
      const b = B[k];
      const locked = !!b.locked;
      const poor = !locked && st.energy < b.cost;
      return {
        art: k, name: b.name, effect: b.effect, locked, disabled: locked || poor,
        label: locked ? b.locked : (poor ? '能量不足 ' + b.cost : b.cost + ' 能量'),
        btn: locked || poor ? 'background:#2A2A31;color:#8A8A94' : 'background:#DCF26A;color:#121212',
        build: () => {
          if (locked || this.state.energy < b.cost || this.state.buildSlot === null) return;
          const arr = this.state.slots[t].slice();
          arr[this.state.buildSlot] = k;
          this.setState({ slots: { ...this.state.slots, [t]: arr }, energy: this.state.energy - b.cost, buildSlot: null });
          this.flash(b.name + ' 建好了 · ' + b.effect);
        }
      };
    });
    const heroes = hs.map((k, i) => ({ art: k, name: H[k].name, aria: H[k].name + '，点击撤回', remove: () => { const arr = hs.slice(); arr.splice(i, 1); this.setState({ heroes: { ...this.state.heroes, [t]: arr } }); this.flash(H[k].name + ' 已撤回'); } }));
    const roster = Object.keys(H).map((k) => {
      const here = hs.indexOf(k) >= 0;
      return {
        art: k, name: H[k].name, effect: H[k].effect, pressed: here ? 'true' : 'false',
        box: here ? 'border:1.5px solid #DCF26A;background:#1E2213' : 'border:1.5px solid #2A2A31;background:#24242A',
        pick: () => {
          if (here) return;
          if (hs.length >= cap) { this.flash('驻守已满，盖一座小屋可以 +1 上限'); return; }
          this.setState({ heroes: { ...this.state.heroes, [t]: hs.concat([k]) } });
          this.flash(H[k].name + ' 已派去驻守 · ' + H[k].effect);
        }
      };
    });
    const buffs = [];
    if (count('tower')) buffs.push({ c: '#C9C9D1', t: '瞭望塔 ×' + count('tower') + '：守卫值 +' + 20 * count('tower') + '%' });
    if (count('campfire')) buffs.push({ c: '#FF6A3D', t: '篝火 ×' + count('campfire') + '：每天 +' + 30 * count('campfire') + ' 能量' });
    if (count('mill')) buffs.push({ c: '#5BBF6A', t: '风车磨坊：步数转化能量 ×1.2' });
    if (count('well')) buffs.push({ c: '#6FD3E8', t: '水井：伙伴孵化 +20%' });
    if (count('house')) buffs.push({ c: '#F28DC0', t: '小屋 ×' + count('house') + '：驻守上限 +' + count('house') });
    hs.forEach((k) => buffs.push({ c: '#B4A3F5', t: H[k].name + '驻守：' + H[k].effect }));
    if (!buffs.length) buffs.push({ c: '#3A3A42', t: '还没有加成，先盖一座篝火吧' });
    return {
      terrs, slots, catalog, heroes, roster, buffs,
      cur: TR[t], guard, daily, cap, heroCount: hs.length, used, lv,
      noHero: hs.length === 0,
      energyText: st.energy.toLocaleString('en-US'),
      buildOpen: st.buildSlot !== null, closeBuild: () => this.setState({ buildSlot: null }),
      heroOpen: st.heroOpen, openHero: () => this.setState({ heroOpen: true }), closeHero: () => this.setState({ heroOpen: false }),
      hasToast: !!st.toast, toast: st.toast
    };
  }
}
</script>
