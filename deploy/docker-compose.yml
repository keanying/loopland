# Local development: PostgreSQL 16 + PostGIS, Redis 7 and the API (dev mode).
#   docker compose -f deploy/docker-compose.yml up -d --build
# The API migrates the database on start. Admin login: admin / admin-password-1
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: loopland
      POSTGRES_PASSWORD: loopland
      POSTGRES_DB: loopland
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopland"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ../server
    environment:
      LOOPLAND_ENV: dev
      LOOPLAND_DATABASE_URL: postgres://loopland:loopland@postgres:5432/loopland?sslmode=disable
      LOOPLAND_REDIS_URL: redis://redis:6379/0
      LOOPLAND_BOOTSTRAP_ADMIN: admin:admin-password-1
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
