# 本地一键启动（Linux / macOS / Windows 的 Docker Desktop 通用）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml run --rm seed     # 可选：灌演示数据
# 后端 API      http://localhost:8080
# 管理端        http://localhost:8000   （admin / admin-password-1）
# 数据库与缓存   localhost:5432（loopland/loopland）、localhost:6379
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: loopland
      POSTGRES_PASSWORD: loopland
      POSTGRES_DB: loopland
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopland"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ../server
    environment:
      LOOPLAND_ENV: dev
      LOOPLAND_DATABASE_URL: postgres://loopland:loopland@postgres:5432/loopland?sslmode=disable
      LOOPLAND_REDIS_URL: redis://redis:6379/0
      LOOPLAND_BOOTSTRAP_ADMIN: admin:admin-password-1
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  admin:
    build:
      context: ../admin
      dockerfile: ../deploy/admin.Dockerfile
      additional_contexts:
        deploy: .
    ports: ["8000:80"]
    depends_on: [api]
  # One-shot: docker compose -f deploy/docker-compose.yml run --rm seed
  seed:
    build: ../server
    entrypoint: ["/loopland-seed", "-api", "http://api:8080", "-admin", "admin:admin-password-1"]
    depends_on: [api]
    profiles: ["tools"]

volumes:
  pgdata:
